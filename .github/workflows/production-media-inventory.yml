name: MakeupArt V8 Production Media Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-media-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: makeupart-v8-production-media-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DATABASE_URL: \${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
      MEDIA_BUCKET: makeupart-media
    steps:
      - name: Validate database connection secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${DATABASE_URL:-}" || {
            echo "::error::Missing production Supabase PostgreSQL connection secret."
            exit 1
          }
          echo "Production database secret is present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: python -m pip install --disable-pip-version-check --no-input "psycopg2-binary==2.9.13"

      - name: Read production record counts and media references only
        shell: bash
        env:
          DATABASE_URL: \${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
          MEDIA_BUCKET: makeupart-media
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import psycopg2
          from psycopg2.extras import RealDictCursor

          url = os.environ["DATABASE_URL"].strip()
          bucket = os.environ["MEDIA_BUCKET"]
          conn = psycopg2.connect(url, connect_timeout=15, sslmode="require")
          try:
              with conn.cursor(cursor_factory=RealDictCursor) as cursor:
                  cursor.execute("SELECT version_num FROM public.alembic_version")
                  revision = cursor.fetchone()["version_num"]
                  if revision != "0013_watermark_content":
                      raise SystemExit("Production database is not at the verified migration head.")

                  required = {
                      "beauty_jobs",
                      "beauty_results",
                      "watermarks",
                  }
                  cursor.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema='public' AND table_name = ANY(%s)
                  """, (list(required),))
                  existing = {row["table_name"] for row in cursor.fetchall()}
                  missing = sorted(required - existing)
                  if missing:
                      raise SystemExit("Production media inventory cannot run; required media tables are missing.")

                  cursor.execute("""
                      SELECT
                        (SELECT count(*) FROM public.beauty_jobs) AS beauty_jobs,
                        (SELECT count(*) FROM public.beauty_results) AS beauty_results,
                        (SELECT count(*) FROM public.beauty_jobs WHERE input_file_path IS NOT NULL) AS job_input_references,
                        (SELECT count(*) FROM public.beauty_jobs WHERE output_file_path IS NOT NULL) AS job_output_references,
                        (SELECT count(*) FROM public.beauty_results WHERE before_image_url IS NOT NULL) AS result_before_references,
                        (SELECT count(*) FROM public.beauty_results WHERE after_image_url IS NOT NULL) AS result_after_references,
                        (SELECT count(*) FROM public.watermarks WHERE logo_url IS NOT NULL) AS salon_logo_references
                  """)
                  media = cursor.fetchone()

                  cursor.execute("""
                      SELECT to_regclass('storage.objects') IS NOT NULL AS storage_objects_available
                  """)
                  storage_available = cursor.fetchone()["storage_objects_available"]
                  if storage_available:
                      cursor.execute("""
                          SELECT count(*) AS object_count,
                                 coalesce(sum((metadata->>'size')::bigint), 0) AS total_bytes
                          FROM storage.objects
                          WHERE bucket_id=%s
                      """, (bucket,))
                      objects = cursor.fetchone()
                  else:
                      objects = {"object_count": 0, "total_bytes": 0}

                  cursor.execute("""
                      SELECT count(*) AS bucket_count
                      FROM storage.buckets
                      WHERE id=%s AND public IS FALSE
                  """, (bucket,))
                  private_bucket_count = cursor.fetchone()["bucket_count"]

                  print(f"Migration head: {revision}")
                  print("Media database inventory (counts only; no customer names, paths, IDs or image data):")
                  for key, value in media.items():
                      print(f"  {key}: {value}")
                  print(f"Supabase private bucket '{bucket}' present: {'yes' if private_bucket_count == 1 else 'no'}")
                  print(f"Supabase media objects: {objects['object_count']}")
                  print(f"Supabase media bytes: {objects['total_bytes']}")

                  refs = sum(int(value or 0) for key, value in media.items() if key.endswith("_references"))
                  if refs > 0 and int(objects["object_count"]) == 0:
                      print("::warning::Database contains media references but the Supabase media bucket is empty; older media may still reside in another provider or may need restoration.")
                  elif refs == 0 and int(objects["object_count"]) == 0:
                      print("No media references or objects were found in the production database/bucket.")
                  elif int(objects["object_count"]) > 0:
                      print("Supabase bucket contains media objects; run the encrypted backup/restore workflow to verify recoverability.")
          finally:
              conn.close()
          PY
