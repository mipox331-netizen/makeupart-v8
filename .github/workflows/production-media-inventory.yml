name: MakeupArt V8 Production Media Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-media-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: makeupart-v8-production-media-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
      MEDIA_BUCKET: makeupart-media
    steps:
      - name: Validate database connection secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || {
            echo "::error::Missing production Supabase PostgreSQL connection secret."
            exit 1
          }
          echo "Production database secret is present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQLAlchemy PostgreSQL client
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            "SQLAlchemy==2.0.54" "psycopg2-binary==2.9.13"

      - name: Read production record counts and media references only
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
          MEDIA_BUCKET: makeupart-media
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"].strip()
          if url.startswith("postgres://"):
              url = "postgresql+psycopg2://" + url[len("postgres://"):]
          bucket = os.environ["MEDIA_BUCKET"]
          engine = create_engine(
              url,
              pool_pre_ping=True,
              connect_args={"connect_timeout": 15, "sslmode": "require"},
          )
          try:
              with engine.connect() as connection:
                  revision = connection.execute(
                      text("SELECT version_num FROM public.alembic_version")
                  ).scalar_one()
                  if revision != "0013_watermark_content":
                      raise SystemExit("Production database is not at the verified migration head.")

                  required = {
                      "beauty_jobs",
                      "beauty_results",
                      "watermarks",
                  }
                  existing = set(connection.execute(text("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema='public' AND table_name = ANY(:required)
                  """), {"required": list(required)}).scalars().all())
                  missing = sorted(required - existing)
                  if missing:
                      raise SystemExit("Production media inventory cannot run; required media tables are missing.")

                  media = {
                      "beauty_jobs": connection.execute(
                          text("SELECT count(*) FROM public.beauty_jobs")
                      ).scalar_one(),
                      "beauty_results": connection.execute(
                          text("SELECT count(*) FROM public.beauty_results")
                      ).scalar_one(),
                  }
                  column_rows = connection.execute(text("""
                      SELECT table_name, column_name
                      FROM information_schema.columns
                      WHERE table_schema='public'
                        AND table_name = ANY(:tables)
                  """), {"tables": ["beauty_jobs", "beauty_results", "watermarks"]}).all()
                  column_names = {(row[0], row[1]) for row in column_rows}
                  reference_columns = [
                      ("beauty_jobs", "before_image_url", "job_before_references"),
                      ("beauty_jobs", "after_image_url", "job_after_references"),
                      ("beauty_jobs", "input_file_path", "job_input_references"),
                      ("beauty_jobs", "output_file_path", "job_output_references"),
                      ("beauty_results", "before_image_url", "result_before_references"),
                      ("beauty_results", "after_image_url", "result_after_references"),
                      ("watermarks", "logo_url", "salon_logo_references"),
                  ]
                  missing_media_columns = []
                  for table_name, column_name, metric_name in reference_columns:
                      if (table_name, column_name) not in column_names:
                          media[metric_name] = "column_missing"
                          missing_media_columns.append(f"{table_name}.{column_name}")
                          continue
                      safe_identifier = f'"{column_name}"'
                      metric = connection.execute(text(
                          f"SELECT count(*) FROM public.{table_name} WHERE {safe_identifier} IS NOT NULL"
                      )).scalar_one()
                      media[metric_name] = metric

                  storage_available = bool(connection.execute(
                      text("SELECT to_regclass('storage.objects') IS NOT NULL")
                  ).scalar_one())
                  if storage_available:
                      objects = connection.execute(text("""
                          SELECT count(*) AS object_count,
                                 coalesce(sum((metadata->>'size')::bigint), 0) AS total_bytes
                          FROM storage.objects
                          WHERE bucket_id=:bucket
                      """), {"bucket": bucket}).mappings().one()
                  else:
                      objects = {"object_count": 0, "total_bytes": 0}

                  private_bucket_count = connection.execute(text("""
                      SELECT count(*)
                      FROM storage.buckets
                      WHERE id=:bucket AND public IS FALSE
                  """), {"bucket": bucket}).scalar_one()

                  print(f"Migration head: {revision}")
                  print("Media database inventory (counts only; no customer names, paths, IDs or image data):")
                  for key, value in media.items():
                      print(f"  {key}: {value}")
                  print(f"Supabase private bucket '{bucket}' present: {'yes' if private_bucket_count == 1 else 'no'}")
                  print(f"Supabase media objects: {objects['object_count']}")
                  print(f"Supabase media bytes: {objects['total_bytes']}")

                  if missing_media_columns:
                      print("::warning::Database schema is missing expected media columns: " + ", ".join(missing_media_columns))
                  numeric_refs = [
                      int(value or 0)
                      for key, value in media.items()
                      if key.endswith("_references") and isinstance(value, (int, float))
                  ]
                  refs = sum(numeric_refs)
                  if refs > 0 and int(objects["object_count"]) == 0:
                      print("::warning::Database contains media references but the Supabase media bucket is empty; older media may still reside in another provider or may need restoration.")
                  elif refs == 0 and not missing_media_columns and int(objects["object_count"]) == 0:
                      print("No media references or objects were found in the production database/bucket.")
                  elif int(objects["object_count"]) > 0:
                      print("Supabase bucket contains media objects; run the encrypted backup/restore workflow to verify recoverability.")
          finally:
              engine.dispose()
          PY
