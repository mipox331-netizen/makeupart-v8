name: One-time Flutter lockfile recovery
on:
  push:
    branches:
      - fix/flutter-lockfile-and-license-evidence-20261012
    paths:
      - ".github/workflows/one-time-flutter-lockfile-recovery.yml"
      - "makeup_art_v8/pubspec.lock"

permissions:
  actions: read
  contents: write

jobs:
  recover-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download the verified license inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: makeupart-third-party-license-inventory-38268979353
          run-id: 38268979353
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/license-inventory

      - name: Restore the exact resolved Flutter lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/license-inventory/pubspec.lock"
          install -m 0644 "${RUNNER_TEMP}/license-inventory/pubspec.lock" makeup_art_v8/pubspec.lock
          git diff --check
          test "$(grep -c '^  [a-zA-Z0-9_]*:$' makeup_art_v8/pubspec.lock)" -ge 80

      - name: Commit lockfile to this temporary fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makeup_art_v8/pubspec.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "build(mobile): restore resolved Flutter dependency lockfile"
          git push origin "${GITHUB_REF_NAME}"
