name: MakeupArt V8 Encrypted Production Database Backup

on:
  schedule:
    - cron: "30 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-database-backup.yml"
      - "backend/scripts/google_drive_backup_upload.py"
  workflow_dispatch:
  # Capture the database only after the additive Supabase migration succeeds.
  workflow_run:
    workflows: ["MakeupArt V8 Supabase Database Migration"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: makeupart-v8-production-db-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout backup uploader code
        uses: actions/checkout@v4

      - name: Validate backup secrets without printing values
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || {
            echo "::error::Missing SUPABASE_DB_URL (or SUPABASE_DB_URL_SECRET/DATABASE_URL) in the production GitHub environment."
            exit 1
          }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || {
            echo "::error::Missing BACKUP_ENCRYPTION_PASSPHRASE in GitHub Actions secrets. Set a strong unique passphrase and store it safely offline."
            exit 1
          }
          if [[ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 24 ]]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 24 characters."
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          raw = os.environ["SUPABASE_DB_URL"].strip()
          parsed = urlsplit(raw)
          if parsed.scheme not in {"postgres", "postgresql", "postgresql+psycopg2"}:
              raise SystemExit("Database backup URL must use a PostgreSQL scheme")
          if not parsed.hostname or not parsed.path.strip("/"):
              raise SystemExit("Database backup URL must include a host and database name")
          PY

      - name: Dump, encrypt and validate backup archive
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/makeupart-db-backup"
          PASSFILE="$RUNNER_TEMP/makeupart-backup-passphrase"
          URLFILE="$RUNNER_TEMP/makeupart-normalized-db-url"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ARCHIVE="$BACKUP_DIR/makeupart-db-$STAMP.dump.gpg"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          trap 'rm -f "$BACKUP_DIR/makeupart.dump" "$BACKUP_DIR/verify.dump" "$PASSFILE" "$URLFILE"' EXIT

          python - <<'PY' > "$URLFILE"
          import os
          from urllib.parse import parse_qsl, quote, urlsplit, urlunsplit
          raw = os.environ["SUPABASE_DB_URL"].strip()
          parsed = urlsplit(raw)
          if parsed.scheme == "postgresql+psycopg2":
              parsed = parsed._replace(scheme="postgresql")

          # Supabase's transaction pooler (6543) is not the right connection
          # mode for pg_dump. Use the session-pooler port when this URL is a
          # Supavisor pooler URL, and qualify the default Postgres username
          # with this Supabase project ref when the supplied URI uses "postgres".
          hostname = parsed.hostname or ""
          netloc = parsed.netloc
          if hostname.endswith(".pooler.supabase.com"):
              if parsed.username == "postgres" and "@" in netloc:
                  userinfo, _, hostport = netloc.rpartition("@")
                  _, password_sep, raw_password = userinfo.partition(":")
                  user = quote("postgres.riakbjcxcaqjaqagncmu", safe="")
                  userinfo = user + (":" + raw_password if password_sep else "")
                  netloc = userinfo + "@" + hostport
              userinfo, at, hostport = netloc.rpartition("@")
              if not at:
                  hostport = netloc
              host, port_sep, port = hostport.rpartition(":")
              if port_sep and port == "6543":
                  hostport = host + ":5432"
                  netloc = (userinfo + "@" if at else "") + hostport
              parsed = parsed._replace(netloc=netloc)

          query = dict(parse_qsl(parsed.query, keep_blank_values=True))
          query.setdefault("sslmode", "require")
          print(urlunsplit(parsed._replace(query=__import__("urllib.parse", fromlist=["urlencode"]).urlencode(query))))
          PY
          DB_URL_NORMALIZED="$(cat "$URLFILE")"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$PASSFILE"
          chmod 600 "$PASSFILE"

          docker run --rm \
            --env DATABASE_URL="$DB_URL_NORMALIZED" \
            --volume "$BACKUP_DIR:/backup" \
            postgres:17-alpine sh -euc '
              pg_dump --no-owner --no-acl --format=custom \
                --file=/backup/makeupart.dump "$DATABASE_URL"
            '

          gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-file "$PASSFILE" --symmetric --cipher-algo AES256 \
            --output "$ARCHIVE" "$BACKUP_DIR/makeupart.dump"

          # Decrypt into a temporary file and validate the custom dump header/list.
          gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-file "$PASSFILE" --decrypt \
            --output "$BACKUP_DIR/verify.dump" "$ARCHIVE"
          docker run --rm --volume "$BACKUP_DIR:/backup" postgres:17-alpine \
            pg_restore --list "/backup/verify.dump" >/dev/null

          rm -f "$BACKUP_DIR/makeupart.dump" "$BACKUP_DIR/verify.dump"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "Encrypted PostgreSQL backup created and archive readability verified."
          echo "::notice::This database backup excludes private customer photos and logos; the separate encrypted private-media backup must also pass."

      - name: Set up Python for private Drive backup upload
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Drive backup upload dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input requests
          python -m py_compile backend/scripts/google_drive_backup_upload.py

      - name: Store encrypted PostgreSQL backup in private Google Drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID || secrets.GDRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET || secrets.GDRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN || secrets.GDRIVE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARCHIVES < <(find "$RUNNER_TEMP/makeupart-db-backup" -maxdepth 1 -type f -name '*.dump.gpg' -print)
          [[ "${#ARCHIVES[@]}" -eq 1 ]] || { echo "::error::Expected exactly one encrypted database archive."; exit 1; }
          python backend/scripts/google_drive_backup_upload.py "${ARCHIVES[0]}" "${ARCHIVES[0]}.sha256" "$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-db-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/makeupart-db-backup/*.dump.gpg
            ${{ runner.temp }}/makeupart-db-backup/*.dump.gpg.sha256
          if-no-files-found: error
          retention-days: 14
