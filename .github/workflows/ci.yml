name: MakeupArt V8 CI
# Force a PR validation run for the production Android build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL for the manually built Android APK"
        required: false
        default: "https://makeupart-api.onrender.com/api/v1"

concurrency:
  group: makeupart-v8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check commit freshness
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main
          current_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$current_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale commit $GITHUB_SHA; current main is $current_sha."
          fi

  backend:
    needs: freshness
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-test-secret-key
          DATABASE_URL=postgresql+psycopg2://makeupart:makeupart@db:5432/makeupart
          POSTGRES_USER=makeupart
          POSTGRES_PASSWORD=makeupart
          POSTGRES_DB=makeupart
          CORS_ORIGINS=*
          EOF

      - name: Validate production compose
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.production.yml --env-file .env.production config >/dev/null

      - name: Build backend image
        run: docker compose build backend

      - name: Start database
        run: docker compose up -d db

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U makeupart -d makeupart; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Run migrations
        run: docker compose run --rm backend alembic upgrade head

      - name: Run backend tests
        run: docker compose run --rm backend pytest -q

      - name: Start backend
        run: |
          docker compose up -d backend
          sleep 5
          docker compose ps

      - name: Health check
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          docker compose logs db
          exit 1

      - name: Show backend logs
        if: always()
        run: docker compose logs backend

      - name: Cleanup
        if: always()
        run: docker compose down -v


  flutter:
    needs: freshness
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: makeup_art_v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify production API
        run: curl --fail --silent --show-error https://makeupart-api.onrender.com/health/ready

      - name: Build Android debug APK
        run: |
          if [ -d android ]; then
            flutter build apk --debug --dart-define=API_BASE_URL="${{ inputs.api_base_url || 'https://makeupart-api.onrender.com/api/v1' }}"
          else
            echo "Android platform not bootstrapped yet; skipping APK build."
          fi

      - name: Upload Android debug APK
        if: ${{ hashFiles('makeup_art_v8/android/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-debug
          path: makeup_art_v8/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
