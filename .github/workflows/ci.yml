name: MakeupArt V8 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL for the manually built Android APK"
        required: false
        default: ""

concurrency:
  group: makeupart-v8-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check commit freshness
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main
          current_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$current_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale commit $GITHUB_SHA; current main is $current_sha."
          fi

  backend:
    needs: freshness
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          # CI uses an isolated local PostgreSQL container. Never commit these values.
          cat > .env <<'EOF'
          SECRET_KEY=ci-test-secret-key-012345678901234567890123
          DATABASE_URL=postgresql+psycopg2://makeupart:makeupart@db:5432/makeupart
          POSTGRES_USER=makeupart
          POSTGRES_PASSWORD=makeupart
          POSTGRES_DB=makeupart
          CORS_ORIGINS=*
          EOF

          # docker-compose.production.yml still provides a self-hosted PostgreSQL/Caddy
          # validation path. Keep its CI values ephemeral and separate from Supabase
          # production secrets.
          cat > .env.production <<'EOF'
          PROJECT_NAME=MakeupArt V8
          API_V1_STR=/api/v1
          ENVIRONMENT=production
          SECRET_KEY=ci-production-secret-key-012345678901234567890123
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=30
          DATABASE_URL=postgresql+psycopg2://makeupart:makeupart@db:5432/makeupart
          CORS_ORIGINS=*
          MEDIA_ROOT=/app/media
          MAX_UPLOAD_BYTES=10485760
          MAX_IMAGE_PIXELS=40000000
          DB_POOL_SIZE=5
          DB_MAX_OVERFLOW=10
          DB_POOL_RECYCLE_SECONDS=1800
          LOG_LEVEL=INFO
          MEDIA_RETENTION_DAYS=30
          REFRESH_SESSION_RETENTION_DAYS=7
          SUBSCRIPTION_TRIAL_DAYS=30
          PLATFORM_ADMIN_EMAILS=
          POSTGRES_USER=makeupart
          POSTGRES_PASSWORD=makeupart
          POSTGRES_DB=makeupart
          DOMAIN=localhost
          CADDY_EMAIL=ci@example.invalid
          EOF

      - name: Validate production compose
        run: |
          docker compose -f docker-compose.production.yml --env-file .env.production config >/dev/null
      - name: Build backend image
        run: docker compose build backend

      - name: Start database
        run: docker compose up -d db

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U makeupart -d makeupart; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Run migrations
        run: docker compose run --rm backend alembic upgrade head

      - name: Check for missing Alembic migrations
        run: docker compose run --rm backend alembic check

      - name: Run backend tests
        run: docker compose run --rm backend pytest -q

      - name: Start backend
        run: |
          docker compose up -d backend
          sleep 5
          docker compose ps

      - name: Health check
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          docker compose logs db
          exit 1

      - name: Show backend logs
        if: always()
        run: docker compose logs backend

      - name: Cleanup
        if: always()
        run: docker compose down -v


  flutter:
    needs: freshness
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: makeup_art_v8
    env:
      PRODUCTION_API_BASE_URL: ${{ inputs.api_base_url || 'https://mipox331-netizen--makeupart-v8-api-fastapi-app.modal.run/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify production API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${PRODUCTION_API_BASE_URL%/api/v1}/health/ready"
          echo

      - name: Build Android debug APK
        run: |
          if [ -d android ]; then
            flutter build apk --debug --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"
          else
            echo "Android platform not bootstrapped yet; skipping APK build."
          fi

      - name: Upload Android debug APK
        if: ${{ hashFiles('makeup_art_v8/android/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-debug
          path: makeup_art_v8/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

