name: MakeupArt V8 Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL"
        required: false
        default: "https://makeupart-api.onrender.com/api/v1"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: makeup_art_v8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL="${{ inputs.api_base_url || 'https://makeupart-api.onrender.com/api/v1' }}"

      - name: Prepare APK
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/MakeupArt-V8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-apk
          path: artifacts/MakeupArt-V8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v8.0.${{ github.run_number }}"
          gh release create "$TAG" ../artifacts/MakeupArt-V8.apk \
            --title "MakeupArt V8 Android APK $TAG" \
            --notes "Installable MakeupArt V8 Android APK built from commit $GITHUB_SHA."
