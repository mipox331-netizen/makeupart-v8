name: MakeupArt V8 Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL (required; use MAKEUPART_API_BASE_URL secret or manual input)"
        required: false
        default: ""

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_API_ROOT: https://mipox331-netizen--makeupart-v8-api-fastapi-app.modal.run
    defaults:
      run:
        working-directory: makeup_art_v8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android release APK
        run: |
          flutter build apk --release \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL="${{ inputs.api_base_url || secrets.MAKEUPART_API_BASE_URL || env.PRODUCTION_API_ROOT }}"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          echo "APK path: $APK"
          echo "APK size bytes: $(stat -c%s "$APK")"
          echo "APK size MB: $(du -m "$APK" | cut -f1)"
          sha256sum "$APK"
          unzip -p "$APK" AndroidManifest.xml >/dev/null || true
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/MakeupArt-V8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-apk-release
          path: artifacts/MakeupArt-V8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v8.0.${{ github.run_number }}"
          gh release create "$TAG" ../artifacts/MakeupArt-V8.apk \
            --title "MakeupArt V8 Android APK $TAG" \
            --notes "Installable MakeupArt V8 Android release APK built from commit $GITHUB_SHA."
