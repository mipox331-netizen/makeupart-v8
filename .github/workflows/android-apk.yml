name: MakeupArt V8 Android APK

permissions:
  actions: read
  contents: write

# Serialize Android release jobs and derive the next app version from published tags.
# Failed/skipped workflow runs must not consume a customer-facing version number.
concurrency:
  group: makeupart-v8-android-apk-${{ github.ref }}
  cancel-in-progress: false

# A public APK is published only after the same main-branch commit passes full CI.
# The production gate below then verifies whether Render has deployed that commit.
on:
  workflow_run:
    workflows: ["MakeupArt V8 CI"]
    types: [completed]
    branches: [main]

jobs:
  # Always build from the current source, but only after the same backend revision
  # is visible on the live Render API. A green workflow must not hide a skipped APK.
  classify-push:
    # Do not release from a failed or cancelled CI run.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      expected_backend_sha: ${{ steps.detect.outputs.expected_backend_sha }}
      source_sha: ${{ steps.detect.outputs.source_sha }}
      release_required: ${{ steps.detect.outputs.release_required }}
    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine release scope and deployed backend revision
        id: detect
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot determine the exact source commit that passed CI."
            exit 1
          fi

          # A successful workflow_run can still come from a CI run whose
          # freshness job deliberately skipped backend/Flutter jobs. Never
          # publish an APK from a commit that is no longer the main-branch tip.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$source_sha" != "$current_main_sha" ]]; then
            echo "::notice::Skipping stale CI commit $source_sha; current main is $current_main_sha. The newer commit's own CI run will handle any release."
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            echo "expected_backend_sha=" >> "$GITHUB_OUTPUT"
            echo "release_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parent_sha="$(git rev-parse "${source_sha}^")"
          git diff --name-only "$parent_sha" "$source_sha" > "$RUNNER_TEMP/changed-files.txt"
          echo "Files changed in the CI-verified commit:"
          cat "$RUNNER_TEMP/changed-files.txt"

          backend_changed=false
          release_required=false
          expected_backend_sha=""
          if grep -Eq '^(backend/|modal_app\.py$)' "$RUNNER_TEMP/changed-files.txt"; then
            backend_changed=true
            expected_backend_sha="$source_sha"
          fi
          if grep -Eq '^(makeup_art_v8/|backend/|modal_app\.py$)' "$RUNNER_TEMP/changed-files.txt"; then
            release_required=true
          fi

          # Release builds wait for dependency-security and license checks on
          # this exact main commit. Those checks are intentionally independent
          # workflows, so their completion order is not guaranteed.
          wait_for_gate() {
            local workflow_file="$1"
            local workflow_name="$2"
            local attempt payload run status conclusion
            for attempt in $(seq 1 60); do
              if ! payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?head_sha=${source_sha}&branch=main&event=push&per_page=10")"; then
                echo "::error::Could not inspect ${workflow_name} for source commit ${source_sha}."
                return 1
              fi
              run="$(jq -c --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main")] | sort_by(.run_number) | last // {}' <<<"$payload")"
              status="$(jq -r '.status // "missing"' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "${workflow_name} passed for ${source_sha}."
                  return 0
                fi
                echo "::error::${workflow_name} finished with conclusion ${conclusion:-unknown} for ${source_sha}."
                return 1
              fi
              echo "Waiting for ${workflow_name} on ${source_sha} (status=${status}, attempt ${attempt}/60)."
              sleep 10
            done
            echo "::error::Timed out waiting for ${workflow_name} on ${source_sha}."
            return 1
          }

          if [[ "$release_required" == "true" ]]; then
            wait_for_gate "python-security-audit.yml" "Python Dependency Security Audit"
            wait_for_gate "third-party-license-inventory.yml" "Third-party License Inventory"
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "expected_backend_sha=$expected_backend_sha" >> "$GITHUB_OUTPUT"
          echo "release_required=$release_required" >> "$GITHUB_OUTPUT"
          echo "Source commit that passed CI: $source_sha"
          if [[ "$backend_changed" == "true" ]]; then
            echo "Backend/runtime changed; the APK job will require this exact commit on the live Render API."
          else
            echo "Backend/runtime unchanged; the APK job will require a healthy API but will not demand a backend redeploy."
          fi
          if [[ "$release_required" != "true" ]]; then
            echo "No mobile-app or backend source changes; skip creating an unnecessary APK release."
          fi
  build-android-apk:
    needs: classify-push
    if: ${{ needs.classify-push.outputs.release_required == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_API_BASE_URL: https://makeupart-api.onrender.com/api/v1
      EXPECTED_BACKEND_SHA: ${{ needs.classify-push.outputs.expected_backend_sha }}
      SOURCE_SHA: ${{ needs.classify-push.outputs.source_sha }}
    defaults:
      run:
        working-directory: makeup_art_v8

    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Calculate next unused Android release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          latest_tag="$(git tag --list 'v8.0.*' | grep -E '^v8\.0\.[0-9]+
      # An ephemeral runner debug key is not a valid release signing identity.
      - name: Require persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "${ANDROID_STORE_PASSWORD:-}" ]] || missing+=("ANDROID_STORE_PASSWORD")
          [[ -n "${ANDROID_KEY_PASSWORD:-}" ]] || missing+=("ANDROID_KEY_PASSWORD")
          [[ -n "${ANDROID_KEY_ALIAS:-}" ]] || missing+=("ANDROID_KEY_ALIAS")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Required production Android signing secrets are missing: ${missing[*]}"
            echo "::error::Refusing to build or publish an APK with an ephemeral debug signing key."
            exit 1
          fi
          echo "All four persistent Android signing secrets are present."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies from committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock || { echo "::error::Committed makeup_art_v8/pubspec.lock is required."; exit 1; }
          flutter pub get
          git diff --exit-code -- pubspec.lock || {
            echo "::error::Flutter dependency resolution changed pubspec.lock. Update and commit the lockfile with dependency changes."
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android signing
        working-directory: makeup_art_v8/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, re
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          compact = re.sub(r"\s+", "", raw).rstrip("=")
          if not compact or re.search(r"[^A-Za-z0-9+/]", compact):
              raise SystemExit("ANDROID_KEYSTORE_BASE64 contains invalid base64 characters")
          compact += "=" * ((4 - len(compact) % 4) % 4)
          try:
              data = base64.b64decode(compact, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid base64") from exc
          if len(data) < 1024:
              raise SystemExit("Decoded keystore is unexpectedly small")
          with open("app/upload-keystore.jks", "wb") as fh:
              fh.write(data)
          PY
          keytool -list             -keystore app/upload-keystore.jks             -storepass "$ANDROID_STORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Verify live backend revision, liveness and readiness
        env:
          EXPECTED_BACKEND_SHA: ${{ needs.classify-push.outputs.expected_backend_sha }}
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="${PRODUCTION_API_BASE_URL%/api/v1}"
          EXPECTED="${EXPECTED_BACKEND_SHA:-}"
          EXPECTED_LABEL="$EXPECTED"
          if [[ -z "$EXPECTED_LABEL" ]]; then
            EXPECTED_LABEL="<existing ready backend>"
          fi
          live_body="$(mktemp)"
          ready_body="$(mktemp)"
          trap 'rm -f "$live_body" "$ready_body"' EXIT

          read_json_field() {
            local file="$1"
            local field="$2"
            python - "$file" "$field" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  value = json.load(handle).get(sys.argv[2], "")
              print(value if value is not None else "")
          except Exception:
              print("")
          PY
          }

          live_code=""
          ready_code=""
          live_status=""
          ready_status=""
          deployed_sha=""
          # Render Free may need a cold start. Keep waiting, but fail closed if
          # the live service never reports the exact source revision expected.
          for attempt in $(seq 1 18); do
            live_code="$(curl --silent --show-error --output "$live_body" --write-out '%{http_code}' --connect-timeout 10 --max-time 45 "$API_ROOT/health/live" || true)"
            ready_code="$(curl --silent --show-error --output "$ready_body" --write-out '%{http_code}' --connect-timeout 10 --max-time 45 "$API_ROOT/health/ready" || true)"
            live_status="$(read_json_field "$live_body" status)"
            ready_status="$(read_json_field "$ready_body" status)"
            deployed_sha="$(read_json_field "$ready_body" deployment_commit)"

            revision_matches=true
            if [[ -n "$EXPECTED" && "$deployed_sha" != "$EXPECTED" ]]; then
              revision_matches=false
            fi
            if [[ "$live_code" == "200" && "$live_status" == "alive" && "$ready_code" == "200" && "$ready_status" == "ready" && "$revision_matches" == "true" ]]; then
              echo "Production API liveness: $live_status"
              echo "Production API readiness: $ready_status"
              echo "Production API deployed commit: ${deployed_sha:-not reported}"
              if [[ -n "$EXPECTED" ]]; then
                echo "Production API commit matched the CI-verified source: $EXPECTED"
              else
                echo "Backend sources were unchanged; healthy live backend accepted."
              fi
              exit 0
            fi

            echo "Attempt $attempt/18: live_http=${live_code:-000}, live_status=${live_status:-unknown}, ready_http=${ready_code:-000}, ready_status=${ready_status:-unknown}, deployed_commit=${deployed_sha:-unknown}, expected_commit=$EXPECTED_LABEL"
            if [[ "$attempt" -lt 18 ]]; then
              sleep 20
            fi
          done

          if [[ -n "$EXPECTED" ]]; then
            echo "::error::Refusing to publish an APK: production did not report a ready API running the expected backend commit."
            echo "::error::Expected backend commit: $EXPECTED"
          else
            echo "::error::Refusing to publish an APK: production API did not report healthy liveness and readiness."
          fi
          echo "::error::Last observed live_http=${live_code:-000}, live_status=${live_status:-unknown}, ready_http=${ready_code:-000}, ready_status=${ready_status:-unknown}, deployed_commit=${deployed_sha:-unknown}"
          exit 1

      - name: Build Android release APK
        env:
          RELEASE_VERSION_NAME: ${{ steps.release_version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name="$RELEASE_VERSION_NAME" --build-number="$RELEASE_VERSION_CODE" --split-debug-info=build/symbols --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"
      - name: Verify APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          echo "APK path: $APK"
          echo "APK size bytes: $(stat -c%s "$APK")"
          echo "APK size MB: $(du -m "$APK" | cut -f1)"
          sha256sum "$APK"
          unzip -p "$APK" AndroidManifest.xml >/dev/null
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify "$APK"
          signing_report="$("$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$signing_report"
          keytool -exportcert \
            -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/expected-release-cert.der" >/dev/null
          expected_cert_sha="$(sha256sum "$RUNNER_TEMP/expected-release-cert.der" | cut -d' ' -f1)"
          actual_cert_sha="$(printf '%s\n' "$signing_report" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [[ -z "$actual_cert_sha" || "$actual_cert_sha" != "$expected_cert_sha" ]]; then
            echo "::error::APK signing certificate does not match the configured persistent upload keystore."
            echo "::error::Expected certificate SHA-256: $expected_cert_sha"
            echo "::error::Actual certificate SHA-256: ${actual_cert_sha:-not found}"
            exit 1
          fi
          echo "Verified APK signature matches the configured persistent Android upload keystore."
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/MakeupArt-V8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-apk-release
          path: artifacts/MakeupArt-V8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        working-directory: makeup_art_v8/android
        run: rm -f key.properties app/upload-keystore.jks

      - name: Re-check source is still current main before publishing
        env:
          SOURCE_SHA: ${{ needs.classify-push.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$SOURCE_SHA" != "$current_main_sha" ]]; then
            echo "::error::Refusing to publish an APK built from stale source $SOURCE_SHA; current main is $current_main_sha."
            exit 1
          fi
          echo "Final release freshness check passed for $SOURCE_SHA."

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.classify-push.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" ../artifacts/MakeupArt-V8.apk \
            --title "MakeupArt V8 Android APK $RELEASE_TAG" \
            --notes "Installable MakeupArt V8 Android release APK built from CI-verified commit $SOURCE_SHA." | sort -V | tail -n 1 || true)"
      # An ephemeral runner debug key is not a valid release signing identity.
      - name: Require persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "${ANDROID_STORE_PASSWORD:-}" ]] || missing+=("ANDROID_STORE_PASSWORD")
          [[ -n "${ANDROID_KEY_PASSWORD:-}" ]] || missing+=("ANDROID_KEY_PASSWORD")
          [[ -n "${ANDROID_KEY_ALIAS:-}" ]] || missing+=("ANDROID_KEY_ALIAS")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Required production Android signing secrets are missing: ${missing[*]}"
            echo "::error::Refusing to build or publish an APK with an ephemeral debug signing key."
            exit 1
          fi
          echo "All four persistent Android signing secrets are present."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies from committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock || { echo "::error::Committed makeup_art_v8/pubspec.lock is required."; exit 1; }
          flutter pub get
          git diff --exit-code -- pubspec.lock || {
            echo "::error::Flutter dependency resolution changed pubspec.lock. Update and commit the lockfile with dependency changes."
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android signing
        working-directory: makeup_art_v8/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, re
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          compact = re.sub(r"\s+", "", raw).rstrip("=")
          if not compact or re.search(r"[^A-Za-z0-9+/]", compact):
              raise SystemExit("ANDROID_KEYSTORE_BASE64 contains invalid base64 characters")
          compact += "=" * ((4 - len(compact) % 4) % 4)
          try:
              data = base64.b64decode(compact, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid base64") from exc
          if len(data) < 1024:
              raise SystemExit("Decoded keystore is unexpectedly small")
          with open("app/upload-keystore.jks", "wb") as fh:
              fh.write(data)
          PY
          keytool -list             -keystore app/upload-keystore.jks             -storepass "$ANDROID_STORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Verify live backend revision, liveness and readiness
        env:
          EXPECTED_BACKEND_SHA: ${{ needs.classify-push.outputs.expected_backend_sha }}
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="${PRODUCTION_API_BASE_URL%/api/v1}"
          EXPECTED="${EXPECTED_BACKEND_SHA:-}"
          EXPECTED_LABEL="$EXPECTED"
          if [[ -z "$EXPECTED_LABEL" ]]; then
            EXPECTED_LABEL="<existing ready backend>"
          fi
          live_body="$(mktemp)"
          ready_body="$(mktemp)"
          trap 'rm -f "$live_body" "$ready_body"' EXIT

          read_json_field() {
            local file="$1"
            local field="$2"
            python - "$file" "$field" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  value = json.load(handle).get(sys.argv[2], "")
              print(value if value is not None else "")
          except Exception:
              print("")
          PY
          }

          live_code=""
          ready_code=""
          live_status=""
          ready_status=""
          deployed_sha=""
          # Render Free may need a cold start. Keep waiting, but fail closed if
          # the live service never reports the exact source revision expected.
          for attempt in $(seq 1 18); do
            live_code="$(curl --silent --show-error --output "$live_body" --write-out '%{http_code}' --connect-timeout 10 --max-time 45 "$API_ROOT/health/live" || true)"
            ready_code="$(curl --silent --show-error --output "$ready_body" --write-out '%{http_code}' --connect-timeout 10 --max-time 45 "$API_ROOT/health/ready" || true)"
            live_status="$(read_json_field "$live_body" status)"
            ready_status="$(read_json_field "$ready_body" status)"
            deployed_sha="$(read_json_field "$ready_body" deployment_commit)"

            revision_matches=true
            if [[ -n "$EXPECTED" && "$deployed_sha" != "$EXPECTED" ]]; then
              revision_matches=false
            fi
            if [[ "$live_code" == "200" && "$live_status" == "alive" && "$ready_code" == "200" && "$ready_status" == "ready" && "$revision_matches" == "true" ]]; then
              echo "Production API liveness: $live_status"
              echo "Production API readiness: $ready_status"
              echo "Production API deployed commit: ${deployed_sha:-not reported}"
              if [[ -n "$EXPECTED" ]]; then
                echo "Production API commit matched the CI-verified source: $EXPECTED"
              else
                echo "Backend sources were unchanged; healthy live backend accepted."
              fi
              exit 0
            fi

            echo "Attempt $attempt/18: live_http=${live_code:-000}, live_status=${live_status:-unknown}, ready_http=${ready_code:-000}, ready_status=${ready_status:-unknown}, deployed_commit=${deployed_sha:-unknown}, expected_commit=$EXPECTED_LABEL"
            if [[ "$attempt" -lt 18 ]]; then
              sleep 20
            fi
          done

          if [[ -n "$EXPECTED" ]]; then
            echo "::error::Refusing to publish an APK: production did not report a ready API running the expected backend commit."
            echo "::error::Expected backend commit: $EXPECTED"
          else
            echo "::error::Refusing to publish an APK: production API did not report healthy liveness and readiness."
          fi
          echo "::error::Last observed live_http=${live_code:-000}, live_status=${live_status:-unknown}, ready_http=${ready_code:-000}, ready_status=${ready_status:-unknown}, deployed_commit=${deployed_sha:-unknown}"
          exit 1

      - name: Build Android release APK
        env:
          RELEASE_VERSION_NAME: ${{ steps.release_version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name="$RELEASE_VERSION_NAME" --build-number="$RELEASE_VERSION_CODE" --split-debug-info=build/symbols --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"
      - name: Verify APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          echo "APK path: $APK"
          echo "APK size bytes: $(stat -c%s "$APK")"
          echo "APK size MB: $(du -m "$APK" | cut -f1)"
          sha256sum "$APK"
          unzip -p "$APK" AndroidManifest.xml >/dev/null
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify "$APK"
          signing_report="$("$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$signing_report"
          keytool -exportcert \
            -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/expected-release-cert.der" >/dev/null
          expected_cert_sha="$(sha256sum "$RUNNER_TEMP/expected-release-cert.der" | cut -d' ' -f1)"
          actual_cert_sha="$(printf '%s\n' "$signing_report" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [[ -z "$actual_cert_sha" || "$actual_cert_sha" != "$expected_cert_sha" ]]; then
            echo "::error::APK signing certificate does not match the configured persistent upload keystore."
            echo "::error::Expected certificate SHA-256: $expected_cert_sha"
            echo "::error::Actual certificate SHA-256: ${actual_cert_sha:-not found}"
            exit 1
          fi
          echo "Verified APK signature matches the configured persistent Android upload keystore."
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/MakeupArt-V8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-apk-release
          path: artifacts/MakeupArt-V8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        working-directory: makeup_art_v8/android
        run: rm -f key.properties app/upload-keystore.jks

      - name: Re-check source is still current main before publishing
        env:
          SOURCE_SHA: ${{ needs.classify-push.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$SOURCE_SHA" != "$current_main_sha" ]]; then
            echo "::error::Refusing to publish an APK built from stale source $SOURCE_SHA; current main is $current_main_sha."
            exit 1
          fi
          echo "Final release freshness check passed for $SOURCE_SHA."

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.classify-push.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" ../artifacts/MakeupArt-V8.apk \
            --title "MakeupArt V8 Android APK $RELEASE_TAG" \
            --notes "Installable MakeupArt V8 Android release APK built from CI-verified commit $SOURCE_SHA."