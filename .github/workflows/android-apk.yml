name: MakeupArt V8 Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_API_BASE_URL: https://mipox331-netizen--makeupart-v8-api-fastapi-app.modal.run/api/v1
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    defaults:
      run:
        working-directory: makeup_art_v8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing GitHub secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing GitHub secret ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing GitHub secret ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing GitHub secret ANDROID_KEY_ALIAS"; exit 1; }

      - name: Configure Android signing
        working-directory: makeup_art_v8/android
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, re
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          compact = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          compact = compact.rstrip("=")
          compact += "=" * ((4 - len(compact) % 4) % 4)
          data = base64.b64decode(compact, validate=False)
          if len(data) < 1024:
              raise SystemExit("Decoded keystore is unexpectedly small")
          with open("app/upload-keystore.jks", "wb") as fh:
              fh.write(data)
          PY
          keytool -list             -keystore app/upload-keystore.jks             -storepass "$ANDROID_STORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android release APK
        run: |
          flutter build apk --release \
            --build-name="8.0.${GITHUB_RUN_NUMBER}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          echo "APK path: $APK"
          echo "APK size bytes: $(stat -c%s "$APK")"
          echo "APK size MB: $(du -m "$APK" | cut -f1)"
          sha256sum "$APK"
          unzip -p "$APK" AndroidManifest.xml >/dev/null
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify "$APK"
          "$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/MakeupArt-V8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-apk-release
          path: artifacts/MakeupArt-V8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        working-directory: makeup_art_v8/android
        run: rm -f key.properties app/upload-keystore.jks

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v8.0.${{ github.run_number }}"
          gh release create "$TAG" ../artifacts/MakeupArt-V8.apk \
            --title "MakeupArt V8 Android APK $TAG" \
            --notes "Installable MakeupArt V8 Android release APK built from commit $GITHUB_SHA."
