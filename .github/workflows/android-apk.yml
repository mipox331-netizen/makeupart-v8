name: MakeupArt V8 Android APK

permissions:
  contents: write

# Keep APK releases in build-number order so overlapping pushes cannot publish
# a lower build after a higher build and confuse release consumers.
concurrency:
  group: makeupart-v8-android-apk-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "makeup_art_v8/**"
      - "backend/**"
      - "modal_app.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  # Avoid racing Modal deployment when backend/runtime files change. Build from
  # the exact deployed commit after a successful deployment; frontend-only pushes
  # can build directly if the existing production API passes health checks.
  classify-push:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
    steps:
      - name: Checkout push history
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this push needs a backend deployment first
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the prior revision is unavailable, fail closed: publish only
          # after the deployment workflow succeeds.
          if [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            echo "No valid before-SHA; defer release until deployment succeeds."
            exit 0
          fi

          git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          echo "Changed paths:"
          cat "$RUNNER_TEMP/changed-files.txt"

          if grep -Eq '^(backend/|modal_app\.py$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            echo "Backend/runtime changed; wait for Render deployment, then dispatch this workflow manually."
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            echo "No backend/runtime changes; a direct APK build may proceed if production health checks pass."
          fi

  build-android-apk:
    needs: classify-push
    if: ${{ github.event_name != 'push' || needs.classify-push.outputs.backend_changed != 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_API_BASE_URL: https://makeupart-api.onrender.com/api/v1
    defaults:
      run:
        working-directory: makeup_art_v8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies from committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock || { echo "::error::Committed makeup_art_v8/pubspec.lock is required."; exit 1; }
          flutter pub get
          git diff --exit-code -- pubspec.lock || {
            echo "::error::Flutter dependency resolution changed pubspec.lock. Update and commit the lockfile with dependency changes."
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Determine Android signing mode
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_STORE_PASSWORD:-}" && -n "${ANDROID_KEY_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "use_signing=true" >> "$GITHUB_OUTPUT"
            echo "Configured Android release signing is available."
          elif [[ -z "${ANDROID_KEYSTORE_BASE64:-}" && -z "${ANDROID_STORE_PASSWORD:-}" && -z "${ANDROID_KEY_PASSWORD:-}" && -z "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "use_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android release signing secrets are not configured. Building a release-mode APK with Flutter's debug signing key; this supports manual installation, not Play Store publication."
          else
            echo "::error::Android signing secrets are incomplete. Configure all four secrets or remove all four to use the installable debug-signing fallback."
            exit 1
          fi

      - name: Configure Android signing
        if: steps.signing.outputs.use_signing == 'true'
        working-directory: makeup_art_v8/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, re
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          compact = re.sub(r"\s+", "", raw).rstrip("=")
          if not compact or re.search(r"[^A-Za-z0-9+/]", compact):
              raise SystemExit("ANDROID_KEYSTORE_BASE64 contains invalid base64 characters")
          compact += "=" * ((4 - len(compact) % 4) % 4)
          try:
              data = base64.b64decode(compact, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid base64") from exc
          if len(data) < 1024:
              raise SystemExit("Decoded keystore is unexpectedly small")
          with open("app/upload-keystore.jks", "wb") as fh:
              fh.write(data)
          PY
          keytool -list             -keystore app/upload-keystore.jks             -storepass "$ANDROID_STORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Verify production API liveness and readiness
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="${PRODUCTION_API_BASE_URL%/api/v1}"
          check_health() {
            local endpoint="$1"
            local expected="$2"
            local body http_code actual
            body="$(mktemp)"
            for attempt in 1 2; do
              http_code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 90 "$API_ROOT$endpoint" || true)"
              [[ "$http_code" == "200" ]] && break
              if [[ "$http_code" == "000" || "$http_code" == "502" || "$http_code" == "503" || "$http_code" == "504" ]]; then
                if [[ "$attempt" -lt 2 ]]; then
                  echo "::warning::Production API endpoint $endpoint returned HTTP ${http_code:-000}; retrying once for a possible free-tier cold start."
                  sleep 5
                  continue
                fi
              fi
              break
            done
            if [[ "$http_code" != "200" ]]; then
              local preview
              preview="$(head -c 240 "$body" | tr '\n' ' ' || true)"
              rm -f "$body"
              echo "::error::Production API endpoint $endpoint returned HTTP ${http_code:-000}; response=${preview:-<empty>}"
              return 1
            fi
            actual="$(python - "$body" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  print(json.load(handle).get("status", ""))
          except Exception:
              print("")
          PY
          )"
            rm -f "$body"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Production API endpoint $endpoint expected status '$expected', got '${actual:-<invalid JSON>}'"
              return 1
            fi
            echo "Production API $endpoint: $actual"
          }
          check_health "/health/live" "alive"
          check_health "/health/ready" "ready"

      - name: Build Android release APK
        run: |
          flutter build apk --release \
            --build-name="8.0.${GITHUB_RUN_NUMBER}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          echo "APK path: $APK"
          echo "APK size bytes: $(stat -c%s "$APK")"
          echo "APK size MB: $(du -m "$APK" | cut -f1)"
          sha256sum "$APK"
          unzip -p "$APK" AndroidManifest.xml >/dev/null
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify "$APK"
          "$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/MakeupArt-V8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-apk-release
          path: artifacts/MakeupArt-V8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        working-directory: makeup_art_v8/android
        run: rm -f key.properties app/upload-keystore.jks

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v8.0.${{ github.run_number }}"
          gh release create "$TAG" ../artifacts/MakeupArt-V8.apk \
            --title "MakeupArt V8 Android APK $TAG" \
            --notes "Installable MakeupArt V8 Android release APK built from commit $GITHUB_SHA."
