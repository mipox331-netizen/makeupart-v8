name: MakeupArt V8 Android APK

permissions:
  contents: write

# Keep APK releases in build-number order so overlapping pushes cannot publish
# a lower build after a higher build and confuse release consumers.
concurrency:
  group: makeupart-v8-android-apk-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "makeup_art_v8/**"
      - "backend/**"
      - "modal_app.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  # Always build from the current source, but only after the same backend revision
  # is visible on the live Render API. A green workflow must not hide a skipped APK.
  classify-push:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      expected_backend_sha: ${{ steps.detect.outputs.expected_backend_sha }}
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine expected deployed backend revision
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Render's RENDER_GIT_COMMIT identifies the complete Git revision it deployed,
          # not merely the last commit touching a backend file. Compare the same full SHA
          # that triggered this production-release workflow.
          expected_backend_sha="$GITHUB_SHA"
          if [[ ! "$expected_backend_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot determine the full source revision for this release."
            exit 1
          fi

          backend_changed=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            backend_changed=true
            echo "Manual release requires the latest backend revision to be verified live."
          elif [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            backend_changed=true
            echo "No valid before-SHA; require a live backend revision match."
          else
            git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
            echo "Changed paths:"
            cat "$RUNNER_TEMP/changed-files.txt"
            if grep -Eq '^(backend/|modal_app\.py$)' "$RUNNER_TEMP/changed-files.txt"; then
              backend_changed=true
            fi
          fi

          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "expected_backend_sha=$expected_backend_sha" >> "$GITHUB_OUTPUT"
          echo "Expected live backend commit: $expected_backend_sha"
          if [[ "$backend_changed" == "true" ]]; then
            echo "The APK job will wait for Render to expose this exact commit before building."
          fi

  build-android-apk:
    needs: classify-push
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_API_BASE_URL: https://makeupart-api.onrender.com/api/v1
      EXPECTED_BACKEND_SHA: ${{ needs.classify-push.outputs.expected_backend_sha }}
    defaults:
      run:
        working-directory: makeup_art_v8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies from committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock || { echo "::error::Committed makeup_art_v8/pubspec.lock is required."; exit 1; }
          flutter pub get
          git diff --exit-code -- pubspec.lock || {
            echo "::error::Flutter dependency resolution changed pubspec.lock. Update and commit the lockfile with dependency changes."
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Determine Android signing mode
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_STORE_PASSWORD:-}" && -n "${ANDROID_KEY_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "use_signing=true" >> "$GITHUB_OUTPUT"
            echo "Configured Android release signing is available."
          elif [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "use_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is absent. Building a release-mode APK with Flutter's debug signing key and ignoring any orphaned signing metadata secrets. This is for manual sideloading only, cannot be published to Play Store, and may not update an existing APK signed with a different key. Back up/export local-only photos before uninstalling an older installation."
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 exists but one or more signing password/alias secrets are missing. Configure all four signing secrets together."
            exit 1
          fi

      - name: Configure Android signing
        if: steps.signing.outputs.use_signing == 'true'
        working-directory: makeup_art_v8/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, re
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          compact = re.sub(r"\s+", "", raw).rstrip("=")
          if not compact or re.search(r"[^A-Za-z0-9+/]", compact):
              raise SystemExit("ANDROID_KEYSTORE_BASE64 contains invalid base64 characters")
          compact += "=" * ((4 - len(compact) % 4) % 4)
          try:
              data = base64.b64decode(compact, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid base64") from exc
          if len(data) < 1024:
              raise SystemExit("Decoded keystore is unexpectedly small")
          with open("app/upload-keystore.jks", "wb") as fh:
              fh.write(data)
          PY
          keytool -list             -keystore app/upload-keystore.jks             -storepass "$ANDROID_STORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Verify live backend revision, liveness and readiness
        env:
          EXPECTED_BACKEND_SHA: ${{ needs.classify-push.outputs.expected_backend_sha }}
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="${PRODUCTION_API_BASE_URL%/api/v1}"
          EXPECTED="${EXPECTED_BACKEND_SHA:?Expected backend commit is required}"
          live_body="$(mktemp)"
          ready_body="$(mktemp)"
          trap 'rm -f "$live_body" "$ready_body"' EXIT

          read_json_field() {
            local file="$1"
            local field="$2"
            python - "$file" "$field" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  value = json.load(handle).get(sys.argv[2], "")
              print(value if value is not None else "")
          except Exception:
              print("")
          PY
          }

          live_code=""
          ready_code=""
          live_status=""
          ready_status=""
          deployed_sha=""
          # Render Free may need a cold start. Keep waiting, but fail closed if
          # the live service never reports the exact source revision expected.
          for attempt in $(seq 1 18); do
            live_code="$(curl --silent --show-error --output "$live_body" --write-out '%{http_code}' --connect-timeout 10 --max-time 45 "$API_ROOT/health/live" || true)"
            ready_code="$(curl --silent --show-error --output "$ready_body" --write-out '%{http_code}' --connect-timeout 10 --max-time 45 "$API_ROOT/health/ready" || true)"
            live_status="$(read_json_field "$live_body" status)"
            ready_status="$(read_json_field "$ready_body" status)"
            deployed_sha="$(read_json_field "$ready_body" deployment_commit)"

            if [[ "$live_code" == "200" && "$live_status" == "alive" && "$ready_code" == "200" && "$ready_status" == "ready" && "$deployed_sha" == "$EXPECTED" ]]; then
              echo "Production API liveness: $live_status"
              echo "Production API readiness: $ready_status"
              echo "Production API deployed commit: $deployed_sha"
              exit 0
            fi

            echo "Attempt $attempt/18: live_http=${live_code:-000}, live_status=${live_status:-unknown}, ready_http=${ready_code:-000}, ready_status=${ready_status:-unknown}, deployed_commit=${deployed_sha:-unknown}, expected_commit=$EXPECTED"
            if [[ "$attempt" -lt 18 ]]; then
              sleep 20
            fi
          done

          echo "::error::Refusing to publish an APK: production did not report a ready API running the expected backend commit."
          echo "::error::Expected backend commit: $EXPECTED"
          echo "::error::Last observed live_http=${live_code:-000}, live_status=${live_status:-unknown}, ready_http=${ready_code:-000}, ready_status=${ready_status:-unknown}, deployed_commit=${deployed_sha:-unknown}"
          exit 1

      - name: Build Android release APK
        run: |
          flutter build apk --release \
            --build-name="8.0.${GITHUB_RUN_NUMBER}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          echo "APK path: $APK"
          echo "APK size bytes: $(stat -c%s "$APK")"
          echo "APK size MB: $(du -m "$APK" | cut -f1)"
          sha256sum "$APK"
          unzip -p "$APK" AndroidManifest.xml >/dev/null
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify "$APK"
          "$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/MakeupArt-V8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-v8-android-apk-release
          path: artifacts/MakeupArt-V8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        working-directory: makeup_art_v8/android
        run: rm -f key.properties app/upload-keystore.jks

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v8.0.${{ github.run_number }}"
          gh release create "$TAG" ../artifacts/MakeupArt-V8.apk \
            --title "MakeupArt V8 Android APK $TAG" \
            --notes "Installable MakeupArt V8 Android release APK built from commit $GITHUB_SHA."
