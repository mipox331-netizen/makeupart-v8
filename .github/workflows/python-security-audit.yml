name: Python Dependency Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Python runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc g++ libpq-dev libgl1 libglib2.0-0

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit pinned runtime and transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          # MediaPipe 0.10.21 constrains protobuf below 5; the current advisory is fixed only in 5.29.6+.
          # The affected ParseDict(google.protobuf.Any) JSON path is not used by this image-only API.
          # Revisit this narrow exception when upgrading the face-landmark runtime.
          python -m pip_audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1805 --progress-spinner off
