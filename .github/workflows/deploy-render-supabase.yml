name: MakeupArt V8 Render PostgreSQL and Private Supabase Photo Storage

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-render-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: makeupart-v8-render-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || secrets.RENDER_API_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
      RENDER_SERVICE_ID: "srv-dav25so473hc73d7ee0g"
      API_URL: "https://makeupart-api.onrender.com"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET || 'makeupart-media' }}

    steps:
      - name: Validate deployment credentials without displaying values
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || secrets.RENDER_API_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET || 'makeupart-media' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${RENDER_API_KEY:-}" ]] || missing+=("RENDER_API_KEY or RENDER_API_TOKEN")
          [[ -n "${SUPABASE_DB_URL:-}" ]] || missing+=("SUPABASE_DB_URL or SUPABASE_DB_URL_SECRET")
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Cannot deploy private Supabase Storage. Missing production GitHub environment secrets: ${missing[*]}."
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import re
          from urllib.parse import unquote, urlsplit
          database = urlsplit(os.environ["SUPABASE_DB_URL"].strip())
          project_url = os.environ.get("SUPABASE_URL", "").strip().rstrip("/")
          if not project_url:
              host = (database.hostname or "").lower()
              project_ref = ""
              if host.endswith(".supabase.co") and host.count(".") == 2:
                  candidate = host.removesuffix(".supabase.co")
                  if re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", candidate):
                      project_ref = candidate
              elif host.endswith(".pooler.supabase.com") and database.username:
                  username = unquote(database.username)
                  if "." in username:
                      candidate = username.split(".", 1)[1]
                      if re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", candidate):
                          project_ref = candidate
              if not project_ref:
                  raise SystemExit("Set SUPABASE_URL; its project reference could not be safely derived from SUPABASE_DB_URL.")
              project_url = f"https://{project_ref}.supabase.co"
          try:
              parsed = urlsplit(project_url)
              host = (parsed.hostname or "").lower()
              labels = host.split(".")
              project_ref = labels[0] if len(labels) == 3 and labels[1:] == ["supabase", "co"] else ""
              port = parsed.port
          except ValueError:
              raise SystemExit("SUPABASE_URL is malformed.") from None
          if (
              parsed.scheme != "https"
              or not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", project_ref)
              or parsed.username is not None
              or parsed.password is not None
              or port not in (None, 443)
              or parsed.path
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("SUPABASE_URL must be the canonical HTTPS origin https://<project-ref>.supabase.co.")
          project_url = f"https://{host}"
          bucket = os.environ.get("SUPABASE_MEDIA_BUCKET", "makeupart-media").strip()
          if not bucket or "/" in bucket:
              raise SystemExit("SUPABASE_MEDIA_BUCKET is invalid.")
          print("SUPABASE_URL=" + project_url)
          print("SUPABASE_MEDIA_BUCKET=" + bucket)
          PY
          echo "Render, Supabase PostgreSQL and private-storage credentials are present; values were not printed."

      - name: Set up Python 3.12 for database connectivity validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Supabase PostgreSQL connectivity before changing Render
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg2-binary==2.9.9'
          python - <<'PY'
          import os
          import psycopg2

          database_url = os.environ.get("SUPABASE_DB_URL", "").strip()
          if not database_url:
              raise SystemExit("Supabase PostgreSQL URL is missing.")

          try:
              connection = psycopg2.connect(database_url, connect_timeout=10)
              try:
                  with connection.cursor() as cursor:
                      cursor.execute("SELECT 1")
                      if cursor.fetchone() != (1,):
                          raise RuntimeError("Unexpected PostgreSQL validation result.")
              finally:
                  connection.close()
          except Exception as exc:
              # Keep host-level context only; never print the DSN or credentials.
              print(f"Supabase PostgreSQL preflight failed ({type(exc).__name__}).")
              raise SystemExit(1) from None

          print("Supabase PostgreSQL connectivity verified; Render settings were not changed before this check.")
          PY

      - name: Apply PostgreSQL and private Supabase Storage photo mode to Render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || secrets.RENDER_API_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET || 'makeupart-media' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          service_id = os.environ["RENDER_SERVICE_ID"]
          token = os.environ["RENDER_API_KEY"]
          database_url = os.environ["SUPABASE_DB_URL"]
          supabase_url = os.environ["SUPABASE_URL"]
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          media_bucket = os.environ.get("SUPABASE_MEDIA_BUCKET", "makeupart-media")
          # Verify/create the private media bucket before changing live Render config.
          import urllib.parse
          import urllib.error
          storage_root = supabase_url + "/storage/v1"
          class _NoStorageRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          storage_opener = urllib.request.build_opener(_NoStorageRedirect)

          def storage_request(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  storage_root + path,
                  data=data,
                  method=method,
                  headers={
                      "apikey": service_key,
                      "Authorization": "Bearer " + service_key,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with storage_opener.open(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw or b"{}")
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      payload = json.loads(raw or b"{}")
                  except ValueError:
                      payload = {}
                  code = str(payload.get("code") or payload.get("error") or "")
                  if method == "GET" and (exc.code == 404 or code == "NoSuchBucket"):
                      return exc.code, payload
                  raise RuntimeError(f"Supabase Storage preflight returned HTTP {exc.code} (code={code or 'unknown'}).") from None
          bucket_path = "/bucket/" + urllib.parse.quote(media_bucket, safe="")
          bucket_status, bucket_info = storage_request("GET", bucket_path)
          if bucket_status == 404 or bucket_info.get("code") == "NoSuchBucket":
              storage_request("POST", "/bucket", {
                  "id": media_bucket,
                  "name": media_bucket,
                  "public": False,
                  "file_size_limit": 50 * 1024 * 1024,
                  "allowed_mime_types": ["image/jpeg", "image/png", "image/webp", "application/octet-stream"],
              })
              bucket_status, bucket_info = storage_request("GET", bucket_path)
          if bucket_status != 200 or bucket_info.get("public") is not False:
              raise SystemExit("Supabase media bucket is not confirmed private; Render production settings were not changed.")
          values = {
              "DATABASE_URL": database_url,
              "SUPABASE_DB_URL": database_url,
              "SUPABASE_URL": supabase_url,
              "SUPABASE_SERVICE_ROLE_KEY": service_key,
              "SUPABASE_MEDIA_BUCKET": media_bucket,
              "MEDIA_STORAGE_BACKEND": "supabase_storage",
              "REQUIRE_DURABLE_MEDIA": "true",
              "ENVIRONMENT": "production",
          }

          def request(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, body
              except urllib.error.HTTPError as exc:
                  # Never print a response body; it can contain service configuration.
                  raise RuntimeError(f"Render API returned HTTP {exc.code} for a protected configuration update.") from None
              except urllib.error.URLError:
                  raise RuntimeError("Could not reach the Render API.") from None

          for key, value in values.items():
              status, _ = request(
                  "PUT",
                  f"https://api.render.com/v1/services/{service_id}/env-vars/{key}",
                  {"value": value},
              )
              if status not in (200, 201, 204):
                  raise SystemExit(f"Render did not confirm environment variable {key} (HTTP {status}).")
              print(f"Render environment variable configured: {key}")

          # Confirm only key names, not values, through Render's service API.
          status, body = request("GET", f"https://api.render.com/v1/services/{service_id}/env-vars")
          if status != 200:
              raise SystemExit("Could not verify Render environment-variable keys.")
          try:
              payload = json.loads(body)
          except ValueError:
              raise SystemExit("Render returned invalid environment-variable metadata.")
          names = set()
          if isinstance(payload, list):
              for item in payload:
                  if isinstance(item, dict):
                      nested = item.get("envVar")
                      names.add(str((nested or item).get("key", "")))
          required = set(values)
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Render environment-variable verification failed for: " + ", ".join(missing))
          print("All required database and private-media environment keys are present in Render.")
          PY

      - name: Wait for Render auto-deploy and verify live API and phone-only photo mode
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || secrets.RENDER_API_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          service_id = os.environ["RENDER_SERVICE_ID"]
          expected_commit = os.environ["EXPECTED_COMMIT"]
          token = os.environ["RENDER_API_KEY"]

          def render_deploys():
              req = urllib.request.Request(
                  f"https://api.render.com/v1/services/{service_id}/deploys?limit=20",
                  headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.loads(response.read())
              if isinstance(payload, list):
                  items = payload
              elif isinstance(payload, dict):
                  items = payload.get("deploys") or payload.get("data") or []
              else:
                  items = []
              normalized = []
              for item in items:
                  if isinstance(item, dict):
                      normalized.append(item.get("deploy") if isinstance(item.get("deploy"), dict) else item)
              return [
                  item for item in normalized
                  if isinstance(item, dict)
                  and isinstance(item.get("commit"), dict)
                  and item["commit"].get("id") == expected_commit
              ]

          terminal_failure = {"build_failed", "update_failed", "pre_deploy_failed", "canceled", "deactivated"}
          live = False
          for attempt in range(90):
              try:
                  matching = render_deploys()
              except (urllib.error.URLError, urllib.error.HTTPError, ValueError) as exc:
                  matching = []
                  print(f"Could not query Render deploy state ({type(exc).__name__}); retrying.")
              if matching:
                  deploy = max(matching, key=lambda item: str(item.get("createdAt", "")))
                  state = str(deploy.get("status", "")).lower()
                  deploy_id = str(deploy.get("id", "unknown"))
              else:
                  state = "waiting_for_commit"
                  deploy_id = "not_created"
              print(f"Render auto-deploy {deploy_id}: {state} ({attempt + 1}/90)")
              if state == "live":
                  live = True
                  break
              if state in terminal_failure:
                  raise SystemExit("Render deployment ended unsuccessfully: " + state)
              time.sleep(10)
          if not live:
              raise SystemExit("Render auto-deploy did not reach live state for the expected commit within the verification window.")

          endpoints = {
              "/health/live": ("alive", None),
              "/health/ready": ("ready", None),
              "/health/media-ready": ("ready", "supabase_storage"),
          }
          for path, (expected, expected_storage) in endpoints.items():
              last_error = "no response"
              for attempt in range(18):
                  req = urllib.request.Request(
                      os.environ["API_URL"] + path,
                      headers={"Accept": "application/json"},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          body = json.loads(response.read())
                          if response.status == 200 and body.get("status") == expected:
                              if expected_storage and body.get("storage") != expected_storage:
                                  last_error = "unexpected media storage provider"
                              else:
                                  print(f"Production endpoint verified: {path}")
                                  break
                          else:
                              last_error = "unexpected health response"
                  except (urllib.error.URLError, urllib.error.HTTPError, ValueError, TimeoutError) as exc:
                      last_error = type(exc).__name__
                  if attempt < 17:
                      time.sleep(10)
              else:
                  raise SystemExit(f"Production endpoint failed verification: {path} ({last_error}).")
          print("Render API, Supabase PostgreSQL and private Supabase Storage are live and verified.")
          PY
