name: MakeupArt V8 Encrypted Supabase Media Backup to private GitHub Releases

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/scripts/supabase_media_backup.py"
      - "backend/scripts/github_release_backup.py"
      - "backend/scripts/verify_supabase_media_empty_state.py"
      - ".github/workflows/production-media-backup.yml"
      - ".github/workflows/production-media-restore-drill.yml"

permissions:
  contents: read

concurrency:
  group: makeupart-v8-production-media-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET || 'makeupart-media' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_REPOSITORY: ${{ secrets.BACKUP_REPOSITORY }}
      BACKUP_REPOSITORY_TOKEN: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
      BACKUP_RETENTION_DAYS: "14"
    steps:
      - name: Validate Supabase, private GitHub Releases and encryption secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [[ -n "${DATABASE_URL:-}" ]] || missing+=("SUPABASE_DB_URL or DATABASE_URL for empty-inventory safety check")
          [[ -n "${BACKUP_REPOSITORY:-}" ]] || missing+=("BACKUP_REPOSITORY")
          [[ -n "${BACKUP_REPOSITORY_TOKEN:-}" ]] || missing+=("BACKUP_REPOSITORY_TOKEN")
          [[ "${BACKUP_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || missing+=("valid BACKUP_REPOSITORY owner/name")
          [[ -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]] || missing+=("BACKUP_ENCRYPTION_PASSPHRASE")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production GitHub environment secrets: ${missing[*]}"
            exit 1
          fi
          [[ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 24 ]] || {
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 24 characters."
            exit 1
          }
          echo "Supabase private-storage, private GitHub Releases and encryption credentials are present."

      - name: Checkout application backup code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backup and database verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input httpx "SQLAlchemy==2.0.54" "psycopg2-binary==2.9.13"

      - name: Back up private Supabase Storage media and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/makeupart-media-backup"
          STAGE="$BACKUP_DIR/stage"
          mkdir -p "$STAGE/media"
          chmod 700 "$BACKUP_DIR" "$STAGE" "$STAGE/media"
          python backend/scripts/supabase_media_backup.py "$STAGE/media" "$STAGE/manifest.json"

      - name: Verify an empty Supabase Storage inventory against live database references
        shell: bash
        run: |
          set -euo pipefail
          python backend/scripts/verify_supabase_media_empty_state.py "$RUNNER_TEMP/makeupart-media-backup/stage/manifest.json"

      - name: Encrypt archive and verify isolated restore
        id: encrypted_media
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/makeupart-media-backup"
          STAGE="$BACKUP_DIR/stage"
          ARCHIVE="$BACKUP_DIR/makeupart-media.tar.gz.gpg"
          PASSFILE="$RUNNER_TEMP/makeupart-media-passphrase"
          DECRYPTED="$BACKUP_DIR/verify.tar.gz"
          VERIFY_DIR="$BACKUP_DIR/verify"
          trap 'rm -f "$PASSFILE" "$DECRYPTED" "$BACKUP_DIR/makeupart-media.tar.gz"; rm -rf "$VERIFY_DIR" "$STAGE"' EXIT
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$PASSFILE"
          chmod 600 "$PASSFILE"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$BACKUP_DIR/makeupart-media.tar.gz" -C "$STAGE" media manifest.json
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-file "$PASSFILE" --symmetric --cipher-algo AES256 --output "$ARCHIVE" "$BACKUP_DIR/makeupart-media.tar.gz"
          rm -f "$BACKUP_DIR/makeupart-media.tar.gz"
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-file "$PASSFILE" --decrypt --output "$DECRYPTED" "$ARCHIVE"
          mkdir -p "$VERIFY_DIR"
          tar -xzf "$DECRYPTED" -C "$VERIFY_DIR"
          python - "$VERIFY_DIR/media" "$VERIFY_DIR/manifest.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if manifest.get("format") != "makeupart-supabase-storage-media-backup-v1":
              raise SystemExit("Unknown Supabase Storage media backup manifest format.")
          rows = manifest.get("files", [])
          expected = {row["path"]: row for row in rows}
          if len(expected) != len(rows):
              raise SystemExit("Media restore verification failed: duplicate manifest paths.")
          actual = {}
          for item in root.rglob("*"):
              if item.is_symlink():
                  raise SystemExit("Media restore verification failed: symbolic links are not allowed.")
              if not item.is_file():
                  continue
              relative = item.relative_to(root).as_posix()
              digest = hashlib.sha256()
              size = 0
              with item.open("rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      size += len(block)
                      digest.update(block)
              actual[relative] = {"path": relative, "size": size, "sha256": digest.hexdigest()}
          expected_hashes = {
              path: {"path": row["path"], "size": row["size"], "sha256": row["sha256"]}
              for path, row in expected.items()
          }
          if expected_hashes != actual:
              raise SystemExit("Media restore verification failed: file set or SHA-256 checksums differ.")
          total = sum(row["size"] for row in actual.values())
          if len(actual) != manifest.get("file_count") or total != manifest.get("total_bytes"):
              raise SystemExit("Media restore verification failed: manifest totals differ.")
          print(f"Encrypted Supabase media archive restored in isolation: files={len(actual)}, bytes={total}.")
          if not actual:
              print("No media files currently exist in the private Supabase bucket; database references were checked separately.")
          PY
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Store encrypted media backup in the private backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
          BACKUP_REPOSITORY: ${{ secrets.BACKUP_REPOSITORY }}
          BACKUP_RETENTION_DAYS: "14"
        shell: bash
        run: |
          set -euo pipefail
          python backend/scripts/github_release_backup.py upload media "$RUNNER_TEMP/makeupart-media-backup/makeupart-media.tar.gz.gpg" "$RUNNER_TEMP/makeupart-media-backup/makeupart-media.tar.gz.gpg.sha256" "$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"

      - name: Remove decrypted media and temporary secrets
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/makeupart-media-passphrase" "$RUNNER_TEMP/makeupart-media-backup/verify.tar.gz" "$RUNNER_TEMP/makeupart-media-backup/makeupart-media.tar.gz"
          rm -rf "$RUNNER_TEMP/makeupart-media-backup/stage" "$RUNNER_TEMP/makeupart-media-backup/verify"
