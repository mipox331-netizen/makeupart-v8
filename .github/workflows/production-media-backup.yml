name: MakeupArt V8 Encrypted Production Media Backup

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:
  # Backup is independent of the API runtime: it reads the private Supabase
  # bucket directly, so recovery can proceed even while Render is unavailable.
  push:
    branches: [main]
    paths:
      - "backend/scripts/supabase_media_backup.py"
      - "backend/scripts/verify_supabase_media_empty_state.py"
      - ".github/workflows/production-media-backup.yml"

permissions:
  contents: read

concurrency:
  group: makeupart-v8-production-media-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      SUPABASE_MEDIA_BUCKET: "makeupart-media"
    steps:
      - name: Validate Supabase and encryption secrets without exposing values
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || missing+=("SUPABASE_SECRET or SUPABASE_SERVICE_ROLE_KEY")
          [[ -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]] || missing+=("BACKUP_ENCRYPTION_PASSPHRASE")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production GitHub environment secrets: ${missing[*]}"
            exit 1
          fi
          [[ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 24 ]] || {
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 24 characters."
            exit 1
          }
          echo "Required private-media backup credentials are present."

      - name: Checkout verified application backup code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install private-media backup dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            httpx "SQLAlchemy==2.0.54" "psycopg2-binary==2.9.13"

      - name: Download private Supabase media and build integrity manifest
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
          SUPABASE_MEDIA_BUCKET: "makeupart-media"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/makeupart-media-backup"
          STAGE="$BACKUP_DIR/stage"
          mkdir -p "$STAGE/media"
          chmod 700 "$BACKUP_DIR" "$STAGE" "$STAGE/media"
          python backend/scripts/supabase_media_backup.py "$STAGE/media" "$STAGE/manifest.json"

      - name: Verify empty media inventory against live database references
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_SECRET || secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          python backend/scripts/verify_supabase_media_empty_state.py \
            "$RUNNER_TEMP/makeupart-media-backup/stage/manifest.json"

      - name: Encrypt archive and verify a complete isolated restore
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/makeupart-media-backup"
          STAGE="$BACKUP_DIR/stage"
          ARCHIVE="$BACKUP_DIR/makeupart-media.tar.gz.gpg"
          PASSFILE="$RUNNER_TEMP/makeupart-media-passphrase"
          DECRYPTED="$BACKUP_DIR/verify.tar.gz"
          VERIFY_DIR="$BACKUP_DIR/verify"
          trap 'rm -f "$PASSFILE" "$DECRYPTED" "$BACKUP_DIR/makeupart-media.tar.gz"; rm -rf "$VERIFY_DIR" "$STAGE"' EXIT
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$PASSFILE"
          chmod 600 "$PASSFILE"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$BACKUP_DIR/makeupart-media.tar.gz" -C "$STAGE" media manifest.json
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-file "$PASSFILE" \
            --symmetric --cipher-algo AES256 --output "$ARCHIVE" "$BACKUP_DIR/makeupart-media.tar.gz"
          rm -f "$BACKUP_DIR/makeupart-media.tar.gz"
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-file "$PASSFILE" \
            --decrypt --output "$DECRYPTED" "$ARCHIVE"
          mkdir -p "$VERIFY_DIR"
          tar -xzf "$DECRYPTED" -C "$VERIFY_DIR"
          python - "$VERIFY_DIR/media" "$VERIFY_DIR/manifest.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if manifest.get("format") != "makeupart-supabase-storage-media-backup-v1":
              raise SystemExit("Unknown private Supabase media backup manifest format.")
          rows = manifest.get("files", [])
          expected = {row["path"]: row for row in rows}
          if len(expected) != len(rows):
              raise SystemExit("Media restore verification failed: duplicate manifest paths.")
          actual = {}
          for item in root.rglob("*"):
              if item.is_symlink():
                  raise SystemExit("Media restore verification failed: symbolic links are not allowed.")
              if not item.is_file():
                  continue
              relative = item.relative_to(root).as_posix()
              digest = hashlib.sha256()
              size = 0
              with item.open("rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      size += len(block)
                      digest.update(block)
              actual[relative] = {"path": relative, "size": size, "sha256": digest.hexdigest()}
          expected_hashes = {
              path: {"path": row["path"], "size": row["size"], "sha256": row["sha256"]}
              for path, row in expected.items()
          }
          if expected_hashes != actual:
              raise SystemExit("Media restore verification failed: restored file set or SHA-256 checksums differ.")
          total = sum(row["size"] for row in actual.values())
          if len(actual) != manifest.get("file_count") or total != manifest.get("total_bytes"):
              raise SystemExit("Media restore verification failed: manifest totals differ.")
          if not actual:
              raise SystemExit("Media restore verification failed: archive contains no customer photos or logos.")
          print(f"Encrypted private Supabase media archive decrypted and restored in isolation: files={len(actual)}, bytes={total}. Production storage was not modified.")
          PY
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeupart-media-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/makeupart-media-backup/*.tar.gz.gpg
            ${{ runner.temp }}/makeupart-media-backup/*.tar.gz.gpg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove decrypted media and temporary secrets
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/makeupart-media-passphrase" "$RUNNER_TEMP/makeupart-media-backup/verify.tar.gz" "$RUNNER_TEMP/makeupart-media-backup/makeupart-media.tar.gz"
          rm -rf "$RUNNER_TEMP/makeupart-media-backup/stage" "$RUNNER_TEMP/makeupart-media-backup/verify"
