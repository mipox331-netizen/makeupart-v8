name: Bootstrap Flutter Platforms

on:
  push:
    branches: [main]
    paths:
      - "makeup_art_v8/pubspec.yaml"
      - "makeup_art_v8/lib/**"
      - ".github/workflows/bootstrap_flutter_platforms.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: makeup_art_v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android and iOS platform projects
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org com.makeupart --project-name makeup_art_v8 .
          fi

      - name: Configure mobile permissions
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              tree = ET.parse(manifest)
              root = tree.getroot()
              ns = "http://schemas.android.com/apk/res/android"
              existing = {node.attrib.get(f"{{{ns}}}name") for node in root.findall("uses-permission")}
              for permission in ["android.permission.INTERNET", "android.permission.CAMERA"]:
                  if permission not in existing:
                      node = ET.Element("uses-permission")
                      node.set(f"{{{ns}}}name", permission)
                      root.insert(0, node)
              ET.register_namespace("android", ns)
              tree.write(manifest, encoding="utf-8", xml_declaration=True)

          plist = Path("ios/Runner/Info.plist")
          if plist.exists():
              text = plist.read_text()
              additions = {
                  "NSCameraUsageDescription": "MakeupArt uses the camera to capture client photos for beauty previews.",
                  "NSPhotoLibraryUsageDescription": "MakeupArt uses your photo library to select client photos for beauty previews.",
                  "NSPhotoLibraryAddUsageDescription": "MakeupArt may save processed beauty previews to the photo library.",
              }
              for key, value in additions.items():
                  if f"<key>{key}</key>" not in text:
                      text = text.replace("</dict>", f"<key>{key}</key><string>{value}</string></dict>", 1)
              plist.write_text(text)

      - name: Commit generated platform files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add android ios
          if git diff --cached --quiet; then
            echo "Mobile platform files already present."
            exit 0
          fi
          git commit -m "chore: bootstrap Flutter Android and iOS platforms"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not push generated mobile platform files."
          exit 1
