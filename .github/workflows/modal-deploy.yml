name: MakeupArt V8 Modal Production Deploy
# Retry after refreshed Supabase database credentials
# Trigger production validation
# Production deployment workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: makeupart-v8-modal-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.TOKENID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.TOKEN_SECRET || secrets.TOKENI_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_URL_SECRET: ${{ secrets.SUPABASE_DB_URL_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Validate Modal credentials
        run: modal token info

      - name: Validate SUPABASE_DB_URL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg2-binary==2.9.9'
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, quote, unquote
          import psycopg2

          candidates = [
              ('SUPABASE_DB_URL', os.environ.get('SUPABASE_DB_URL', '').strip()),
              ('SUPABASE_DB_URL_SECRET', os.environ.get('SUPABASE_DB_URL_SECRET', '').strip()),
              ('DATABASE_URL', os.environ.get('DATABASE_URL', '').strip()),
          ]

          def parse_url(raw_url):
              scheme, sep, remainder = raw_url.partition('://')
              if not sep or scheme not in {'postgresql', 'postgresql+psycopg2', 'postgres'}:
                  raise ValueError('not a PostgreSQL URL')

              authority, slash, path_and_query = remainder.partition('/')
              user = password = None
              if '@' in authority:
                  userinfo, hostport = authority.rsplit('@', 1)
                  if ':' in userinfo:
                      user, password = userinfo.rsplit(':', 1)
                  else:
                      user = userinfo
              else:
                  hostport = authority

              host = hostport
              port = None
              if hostport.startswith('['):
                  closing = hostport.find(']')
                  if closing < 0:
                      raise ValueError("unmatched '[' in host")
                  host = hostport[1:closing]
                  tail = hostport[closing + 1:]
                  if tail:
                      if not tail.startswith(':'):
                          raise ValueError('invalid bracketed host/port')
                      port = tail[1:]
              elif ':' in hostport:
                  host, port = hostport.rsplit(':', 1)

              host = host.strip()
              if not host:
                  raise ValueError('missing host')
              if port is not None and not port.isdigit():
                  raise ValueError('invalid port')

              query = ''
              database = ''
              if slash:
                  database, _, query = path_and_query.partition('?')
                  database = unquote(database)

              user = unquote(user) if user is not None else None
              password = unquote(password) if password is not None else None

              kwargs = {'host': host, 'connect_timeout': 10}
              if port:
                  kwargs['port'] = int(port)
              if user is not None:
                  if host.endswith('.pooler.supabase.com') and user == 'postgres':
                      user = 'postgres.riakbjcxcaqjaqagncmu'
                  kwargs['user'] = user
              if password is not None:
                  kwargs['password'] = password
              if database:
                  kwargs['dbname'] = database

              for key, value in parse_qsl(query, keep_blank_values=True):
                  if key in {'user', 'username', 'password', 'dbname', 'database', 'host', 'port'}:
                      continue
                  kwargs[key] = value

              return {'scheme': 'postgresql', 'user': user, 'password': password, 'host': host,
                      'port': int(port) if port else 5432, 'database': database, 'query': query, 'kwargs': kwargs}

          working = None
          failures = []
          for source, raw_url in candidates:
              if not raw_url:
                  continue
              try:
                  parsed = parse_url(raw_url)
                  print(f"Testing Supabase DB candidate: {source} ({parsed['host']}:{parsed['port']}/{parsed['database'] or '<default>'})")
                  conn = psycopg2.connect(**parsed['kwargs'])
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute('SELECT 1')
                          cursor.fetchone()
                  finally:
                      conn.close()
                  print(f'Supabase database connection: OK ({source})')
                  working = parsed
                  break
              except Exception as exc:
                  failures.append((source, str(exc).splitlines()[0]))
                  print(f'Supabase DB candidate failed: {source}')

          if working is None:
              print('No Supabase database candidate connected successfully.')
              for source, error in failures:
                  print(f'{source}: {error}')
              raise SystemExit(1)

          encoded_userinfo = ''
          if working['user'] is not None:
              encoded_userinfo = quote(unquote(working['user']), safe='')
              if working['password'] is not None:
                  encoded_userinfo += ':' + quote(unquote(working['password']), safe='')
              encoded_userinfo += '@'

          host = working['host']
          port = working['port']
          database = working['database']
          query = working['query']
          normalized_host = f'[{host}]' if ':' in host and not host.startswith('[') else host
          normalized_url = f'postgresql://{encoded_userinfo}{normalized_host}:{port}'
          if database:
              normalized_url += '/' + quote(database, safe='')
              if query:
                  normalized_url += '?' + query

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('SUPABASE_DB_URL=' + normalized_url + '\n')

          print(f"Using working Supabase DB target: {host}:{port}/{database or '<default>'}")
          PY
      - name: Provision production secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing."; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-}" || { echo "SUPABASE_SECRET_KEY/SUPABASE_SECRET secret is missing."; exit 1; }
          APP_SECRET_KEY="$(python -c 'import hashlib, os; print(hashlib.sha256(os.environ["SUPABASE_SECRET_KEY"].encode()).hexdigest())')"
          modal secret create --force -e main makeupart-v8-production             "SECRET_KEY=${APP_SECRET_KEY}"             "DATABASE_URL=${SUPABASE_DB_URL}"             "ENVIRONMENT=production"             "PROJECT_NAME=MakeupArt V8"             "API_V1_STR=/api/v1"             "ALGORITHM=HS256"             "ACCESS_TOKEN_EXPIRE_MINUTES=30"             "REFRESH_TOKEN_EXPIRE_DAYS=30"             "CORS_ORIGINS=https://riakbjcxcaqjaqagncmu.supabase.co"             "MEDIA_ROOT=/app/media"             "INSIGHTFACE_ROOT=/home/app/.insightface"             "MAX_UPLOAD_BYTES=10485760"             "MAX_IMAGE_PIXELS=40000000"             "DB_POOL_SIZE=5"             "DB_MAX_OVERFLOW=10"             "DB_POOL_RECYCLE_SECONDS=1800"             "LOG_LEVEL=INFO"             "MEDIA_RETENTION_DAYS=30"             "REFRESH_SESSION_RETENTION_DAYS=7"             "SUBSCRIPTION_TRIAL_DAYS=30"             "PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS}"             "SUPABASE_URL=https://riakbjcxcaqjaqagncmu.supabase.co"             "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"             "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SECRET}"

      - name: Deploy FastAPI
        run: modal deploy modal_app.py

      - name: Run Supabase migrations
        run: modal run modal_app.py::migrate

      - name: Confirm migration head
        run: modal run modal_app.py::verify_migration_head

      - name: Verify AI runtime
        run: modal run modal_app.py::verify_runtime

      - name: Verify deployed app
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT='https://mipox331-netizen--makeupart-v8-api-fastapi-app.modal.run'
          curl --fail --silent --show-error --max-time 30 "$API_ROOT/health/ready"
          echo
          echo "Production API is ready: $API_ROOT"

      - name: Show deployed app
        run: modal app info makeupart-v8-api
