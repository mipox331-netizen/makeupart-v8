name: MakeupArt V8 Modal Production Deploy
# Retry after refreshed Supabase database credentials
# Trigger production validation
# Production deployment workflow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      secret_environment:
        description: "Optional GitHub environment that stores the production deployment secrets"
        required: false
        type: string
        default: ""

concurrency:
  group: makeupart-v8-modal-production
  cancel-in-progress: false

jobs:
  discover-environments:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      environments: ${{ steps.envs.outputs.environments }}
    steps:
      - name: Discover repository environments
        id: envs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_ENVIRONMENT: ${{ inputs.secret_environment || '' }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_ENVIRONMENT" ]; then
            names="$MANUAL_ENVIRONMENT"
            echo "Using manually selected GitHub environment."
          else
            names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/environments" --jq '.environments[].name' || true)"
          fi
          export ENV_NAMES="$names"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          names = [line.strip() for line in os.environ.get("ENV_NAMES", "").splitlines() if line.strip()]
          if "production" not in {name.lower() for name in names}:
              names.append("production")
          print("environments=" + json.dumps(sorted(set(names)), separators=(",", ":")))
          PY

  probe-db-secret:
    needs: discover-environments
    if: ${{ needs.discover-environments.outputs.environments != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.discover-environments.outputs.environments) }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_URL_SECRET: ${{ secrets.SUPABASE_DB_URL_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.TOKENID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.TOKEN_SECRET || secrets.TOKENI_SECRET }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
    steps:
      - name: Check required secret presence without exposing values
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          PROBE_INDEX: ${{ strategy.job-index }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          env = os.environ
          result = {
              "environment": env["TARGET_ENVIRONMENT"],
              "database": any(env.get(k, "").strip() for k in ("SUPABASE_DB_URL", "SUPABASE_DB_URL_SECRET", "DATABASE_URL")),
              "modal_id": bool(env.get("MODAL_TOKEN_ID", "").strip()),
              "modal_secret": bool(env.get("MODAL_TOKEN_SECRET", "").strip()),
              "supabase_app_secret": bool(env.get("SUPABASE_SECRET_KEY", "").strip()),
              "supabase_service_role": bool(env.get("SUPABASE_SECRET", "").strip()),
          }
          filename = f"secret-scope-{env['PROBE_INDEX']}.json"
          with open(filename, "w", encoding="utf-8") as handle:
              json.dump(result, handle)
          required = ("database", "modal_id", "modal_secret", "supabase_app_secret", "supabase_service_role")
          print(f"Environment '{result['environment']}' has required deployment secrets: {all(result[k] for k in required)}")
          PY

      - name: Upload secret scope result
        uses: actions/upload-artifact@v4
        with:
          name: db-secret-probe-${{ strategy.job-index }}
          path: secret-scope-${{ strategy.job-index }}.json
          if-no-files-found: error
          retention-days: 1

  select-db-environment:
    needs: probe-db-secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.select.outputs.environment }}
    steps:
      - name: Download secret scope results
        uses: actions/download-artifact@v4
        with:
          pattern: db-secret-probe-*
          path: probes
          merge-multiple: true

      - name: Select environment containing deployment secrets
        id: select
        shell: bash
        run: |
          set -euo pipefail
          selected="$(python - <<'PY'
          import glob
          import json
          candidates = []
          seen = []
          required = ("database", "modal_id", "modal_secret", "supabase_app_secret", "supabase_service_role")
          for path in glob.glob("probes/secret-scope-*.json"):
              with open(path, encoding="utf-8") as handle:
                  result = json.load(handle)
              seen.append(result)
              if all(result.get(key) for key in required):
                  candidates.append(result["environment"])
          candidates = sorted(set(candidates), key=lambda value: (value.lower() != "production", value.lower()))
          if candidates:
              print(candidates[0])
          else:
              print("No single GitHub environment contains the required deployment secrets.", flush=True)
              for row in seen:
                  ready = ",".join(key for key in required if row.get(key))
                  print(f"Environment '{row.get('environment', '?')}': available={ready or 'none'}", flush=True)
              raise SystemExit(2)
          PY
          )"
          if [ -z "$selected" ]; then
            echo "Unable to select a GitHub environment for production deployment."
            exit 1
          fi
          echo "Selected GitHub environment: $selected"
          echo "environment=$selected" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: select-db-environment
    environment: ${{ needs.select-db-environment.outputs.environment }}
    permissions:
      contents: read

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.TOKENID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.TOKEN_SECRET || secrets.TOKENI_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_URL_SECRET: ${{ secrets.SUPABASE_DB_URL_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Validate Modal credentials
        run: modal token info

      - name: Validate SUPABASE_DB_URL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg2-binary==2.9.9'
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, quote, unquote
          import psycopg2

          candidates = [
              ('SUPABASE_DB_URL', os.environ.get('SUPABASE_DB_URL', '').strip()),
              ('SUPABASE_DB_URL_SECRET', os.environ.get('SUPABASE_DB_URL_SECRET', '').strip()),
              ('DATABASE_URL', os.environ.get('DATABASE_URL', '').strip()),
          ]

          def parse_url(raw_url):
              scheme, sep, remainder = raw_url.partition('://')
              if not sep or scheme not in {'postgresql', 'postgresql+psycopg2', 'postgres'}:
                  raise ValueError('not a PostgreSQL URL')

              authority, slash, path_and_query = remainder.partition('/')
              user = password = None
              if '@' in authority:
                  userinfo, hostport = authority.rsplit('@', 1)
                  if ':' in userinfo:
                      user, password = userinfo.rsplit(':', 1)
                  else:
                      user = userinfo
              else:
                  hostport = authority

              host = hostport
              port = None
              if hostport.startswith('['):
                  closing = hostport.find(']')
                  if closing < 0:
                      raise ValueError("unmatched '[' in host")
                  host = hostport[1:closing]
                  tail = hostport[closing + 1:]
                  if tail:
                      if not tail.startswith(':'):
                          raise ValueError('invalid bracketed host/port')
                      port = tail[1:]
              elif ':' in hostport:
                  host, port = hostport.rsplit(':', 1)

              host = host.strip()
              if not host:
                  raise ValueError('missing host')
              if port is not None and not port.isdigit():
                  raise ValueError('invalid port')

              query = ''
              database = ''
              if slash:
                  database, _, query = path_and_query.partition('?')
                  database = unquote(database)

              user = unquote(user) if user is not None else None
              password = unquote(password) if password is not None else None

              kwargs = {'host': host, 'connect_timeout': 10}
              if port:
                  kwargs['port'] = int(port)
              if user is not None:
                  if host.endswith('.pooler.supabase.com') and user == 'postgres':
                      user = 'postgres.riakbjcxcaqjaqagncmu'
                  kwargs['user'] = user
              if password is not None:
                  kwargs['password'] = password
              if database:
                  kwargs['dbname'] = database

              for key, value in parse_qsl(query, keep_blank_values=True):
                  if key in {'user', 'username', 'password', 'dbname', 'database', 'host', 'port'}:
                      continue
                  kwargs[key] = value

              return {'scheme': 'postgresql', 'user': user, 'password': password, 'host': host,
                      'port': int(port) if port else 5432, 'database': database, 'query': query, 'kwargs': kwargs}

          working = None
          failures = []
          for source, raw_url in candidates:
              if not raw_url:
                  continue
              try:
                  parsed = parse_url(raw_url)
                  print(f"Testing Supabase DB candidate: {source} ({parsed['host']}:{parsed['port']}/{parsed['database'] or '<default>'})")
                  conn = psycopg2.connect(**parsed['kwargs'])
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute('SELECT 1')
                          cursor.fetchone()
                  finally:
                      conn.close()
                  print(f'Supabase database connection: OK ({source})')
                  working = parsed
                  break
              except Exception as exc:
                  failures.append((source, str(exc).splitlines()[0]))
                  print(f'Supabase DB candidate failed: {source}')

          if working is None:
              print('No Supabase database candidate connected successfully.')
              for source, error in failures:
                  print(f'{source}: {error}')
              raise SystemExit(1)

          encoded_userinfo = ''
          if working['user'] is not None:
              encoded_userinfo = quote(unquote(working['user']), safe='')
              if working['password'] is not None:
                  encoded_userinfo += ':' + quote(unquote(working['password']), safe='')
              encoded_userinfo += '@'

          host = working['host']
          port = working['port']
          database = working['database']
          query = working['query']
          normalized_host = f'[{host}]' if ':' in host and not host.startswith('[') else host
          normalized_url = f'postgresql://{encoded_userinfo}{normalized_host}:{port}'
          if database:
              normalized_url += '/' + quote(database, safe='')
              if query:
                  normalized_url += '?' + query

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('SUPABASE_DB_URL=' + normalized_url + '\n')

          print(f"Using working Supabase DB target: {host}:{port}/{database or '<default>'}")
          PY
      - name: Provision production secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing."; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-}" || { echo "SUPABASE_SECRET_KEY/SUPABASE_SECRET secret is missing."; exit 1; }
          APP_SECRET_KEY="$(python -c 'import hashlib, os; print(hashlib.sha256(os.environ["SUPABASE_SECRET_KEY"].encode()).hexdigest())')"
          modal secret create --force -e main makeupart-v8-production             "SECRET_KEY=${APP_SECRET_KEY}"             "DATABASE_URL=${SUPABASE_DB_URL}"             "ENVIRONMENT=production"             "PROJECT_NAME=MakeupArt V8"             "API_V1_STR=/api/v1"             "ALGORITHM=HS256"             "ACCESS_TOKEN_EXPIRE_MINUTES=30"             "REFRESH_TOKEN_EXPIRE_DAYS=30"             "CORS_ORIGINS=https://riakbjcxcaqjaqagncmu.supabase.co"             "MEDIA_ROOT=/app/media"             "INSIGHTFACE_ROOT=/home/app/.insightface"             "MAX_UPLOAD_BYTES=10485760"             "MAX_IMAGE_PIXELS=40000000"             "DB_POOL_SIZE=5"             "DB_MAX_OVERFLOW=10"             "DB_POOL_RECYCLE_SECONDS=1800"             "LOG_LEVEL=INFO"             "MEDIA_RETENTION_DAYS=30"             "REFRESH_SESSION_RETENTION_DAYS=7"             "SUBSCRIPTION_TRIAL_DAYS=30"             "PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS}"             "SUPABASE_URL=https://riakbjcxcaqjaqagncmu.supabase.co"             "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"             "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SECRET}"

      - name: Deploy FastAPI
        run: modal deploy modal_app.py

      - name: Run Supabase migrations
        run: modal run modal_app.py::migrate

      - name: Confirm migration head
        run: modal run modal_app.py::verify_migration_head

      - name: Verify AI runtime
        run: modal run modal_app.py::verify_runtime

      - name: Verify media volume persistence
        run: modal run modal_app.py::verify_media_volume

      - name: Verify deployed app
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT='https://mipox331-netizen--makeupart-v8-api-fastapi-app.modal.run'
          curl --fail --silent --show-error --max-time 30 "$API_ROOT/health/ready"
          echo
          echo "Production API is ready: $API_ROOT"

      - name: Verify production registration and login
        shell: bash
        run: python scripts/production_auth_smoke.py

      - name: Capture sanitized production exception context
        if: failure() && env.PROD_SMOKE_REQUEST_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          sources = [
              ("server", ["modal", "server", "logs", "makeupart-v8-api/fastapi_app", "-e", "main", "--since", "1h", "--tail", "1000", "--timestamps"]),
              ("function", ["modal", "function", "logs", "makeupart-v8-api/fastapi_app", "-e", "main", "--since", "1h", "--tail", "1000", "--timestamps"]),
              ("app", ["modal", "app", "logs", "makeupart-v8-api", "-e", "main", "--since", "1h", "--tail", "1000", "--timestamps"]),
          ]
          chunks = []
          for name, command in sources:
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=60, check=False)
                  content = (result.stdout or "") + "\\n" + (result.stderr or "")
                  chunks.append((name, result.returncode, content))
              except Exception as exc:
                  chunks.append((name, 99, type(exc).__name__))
          request_id = os.environ.get("PROD_SMOKE_REQUEST_ID", "")
          found = False
          for name, code, content in chunks:
              lines = content.splitlines()
              matches = [i for i, line in enumerate(lines) if request_id and request_id in line]
              if matches:
                  found = True
                  for index in matches[-3:]:
                      print(f"Matched production request ID in Modal {name} logs:", request_id)
                      # PostgreSQL errors often occur at the end of a long SQLAlchemy traceback.
                      # Keep a wider window, but report only schema identifiers and exception types.
                      block = lines[max(0, index - 10):min(index + 300, len(lines))]
                      frame_count = 0
                      details = set()
                      for line in block:
                          frame = re.search(r'File "([^"]+)", line (\d+), in ([^ ]+)', line)
                          if frame and frame_count < 18:
                              print(f"Trace frame: {Path(frame.group(1)).name}:{frame.group(2)} in {frame.group(3)}")
                              frame_count += 1
                          not_null = re.search(r'null value in column "([^"]+)" of relation "([^"]+)" violates not-null constraint', line, re.I)
                          if not_null:
                              details.add(f"PostgreSQL NOT NULL violation: table={not_null.group(2)} column={not_null.group(1)}")
                          constraint = re.search(r'constraint "([^"]+)"', line, re.I)
                          if constraint and ("violation" in line.lower() or "violates" in line.lower()):
                              details.add(f"Database constraint: {constraint.group(1)}")
                          missing_column = re.search(r'column "([^"]+)" does not exist', line, re.I)
                          if missing_column:
                              details.add(f"Database missing column: {missing_column.group(1)}")
                          missing_table = re.search(r'relation "([^"]+)" does not exist', line, re.I)
                          if missing_table:
                              details.add(f"Database missing table: {missing_table.group(1)}")
                          exception = re.search(r'([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception|Failure|Violation))(?::|$)', line.strip())
                          if exception:
                              details.add(f"Exception class: {exception.group(1)}")
                      for detail in sorted(details):
                          print(detail)
              else:
                  diagnostic = next((line.strip() for line in lines if re.search(r"Usage:|Error:|not found|not authorized|No such", line, re.I)), "")
                  print(f"Modal {name} logs: request_id_match=False, exit={code}, lines={len(lines)}, diagnostic={diagnostic[:160]!r}")
          if not found:
              print("No Modal log source matched the request ID; only safe command diagnostics were emitted.")
          PY

      - name: Show deployed app
        run: modal app info makeupart-v8-api
