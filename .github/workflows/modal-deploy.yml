name: MakeupArt V8 Modal Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: makeupart-v8-modal-production
  cancel-in-progress: false

jobs:
  diagnose-db-secret-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPOSITORY_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      REPOSITORY_DB_VAR: ${{ vars.SUPABASE_DB_URL }}
    steps:
      - name: Diagnose repository secret scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REPOSITORY_DB_URL:-}" ]; then echo "SUPABASE_DB_URL secret: available at repository scope."; else echo "SUPABASE_DB_URL secret: NOT available at repository scope."; fi
          if [ -n "${REPOSITORY_DB_VAR:-}" ]; then echo "SUPABASE_DB_URL variable: available at repository scope."; else echo "SUPABASE_DB_URL variable: NOT available at repository scope."; fi

  diagnose-production-secret-scope:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PRODUCTION_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PRODUCTION_DB_VAR: ${{ vars.SUPABASE_DB_URL }}
    steps:
      - name: Diagnose production environment secret scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PRODUCTION_DB_URL:-}" ]; then echo "SUPABASE_DB_URL secret: available in production environment."; else echo "SUPABASE_DB_URL secret: NOT available in production environment."; fi
          if [ -n "${PRODUCTION_DB_VAR:-}" ]; then echo "SUPABASE_DB_URL variable: available in production environment."; else echo "SUPABASE_DB_URL variable: NOT available in production environment."; fi

  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.TOKENID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.TOKEN_SECRET || secrets.TOKENI_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Validate Modal credentials
        run: modal token info

      - name: Validate SUPABASE_DB_URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing or empty."; exit 1; }
          python -m pip install --quiet 'sqlalchemy==2.0.35' 'psycopg2-binary==2.9.9'
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          from sqlalchemy import create_engine, text

          url = os.environ['SUPABASE_DB_URL'].strip()
          parsed = urlparse(url.replace('postgresql+psycopg2://', 'postgresql://', 1))
          if parsed.scheme not in {'postgresql', 'postgres'} or not parsed.hostname:
              raise SystemExit('SUPABASE_DB_URL is not a valid PostgreSQL URL.')
          engine = create_engine(url, pool_pre_ping=True, connect_args={'connect_timeout': 10})
          with engine.connect() as connection:
              connection.execute(text('SELECT 1'))
          print('Supabase database connection: OK')
          print(f'Supabase database target: {parsed.hostname}:{parsed.port or 5432}/{parsed.path.lstrip("/")}')
          PY

      - name: Provision production secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing."; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-}" || { echo "SUPABASE_SECRET_KEY/SUPABASE_SECRET secret is missing."; exit 1; }
          APP_SECRET_KEY="$(python -c 'import hashlib, os; print(hashlib.sha256(os.environ["SUPABASE_SECRET_KEY"].encode()).hexdigest())')"
          modal secret create --force -e main makeupart-v8-production \
            "SECRET_KEY=${APP_SECRET_KEY}" \
            "DATABASE_URL=${SUPABASE_DB_URL}" \
            "ENVIRONMENT=production" \
            "PROJECT_NAME=MakeupArt V8" \
            "API_V1_STR=/api/v1" \
            "ALGORITHM=HS256" \
            "ACCESS_TOKEN_EXPIRE_MINUTES=30" \
            "REFRESH_TOKEN_EXPIRE_DAYS=30" \
            "CORS_ORIGINS=https://riakbjcxcaqjaqagncmu.supabase.co" \
            "MEDIA_ROOT=/app/media" \
            "INSIGHTFACE_ROOT=/home/app/.insightface" \
            "MAX_UPLOAD_BYTES=10485760" \
            "MAX_IMAGE_PIXELS=40000000" \
            "DB_POOL_SIZE=5" \
            "DB_MAX_OVERFLOW=10" \
            "DB_POOL_RECYCLE_SECONDS=1800" \
            "LOG_LEVEL=INFO" \
            "MEDIA_RETENTION_DAYS=30" \
            "REFRESH_SESSION_RETENTION_DAYS=7" \
            "SUBSCRIPTION_TRIAL_DAYS=30" \
            "PLATFORM_ADMIN_EMAILS=" \
            "SUPABASE_URL=https://riakbjcxcaqjaqagncmu.supabase.co" \
            "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SECRET}"

      - name: Deploy FastAPI
        run: modal deploy modal_app.py

      - name: Run Supabase migrations
        run: modal run modal_app.py::migrate

      - name: Confirm migration head
        run: modal run modal_app.py::verify_migration_head

      - name: Verify AI runtime
        run: modal run modal_app.py::verify_runtime

      - name: Verify deployed app
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT='https://mipox331-netizen--makeupart-v8-api-fastapi-app.modal.run'
          curl --fail --silent --show-error --max-time 30 "$API_ROOT/health/ready"
          echo
          echo "Production API is ready: $API_ROOT"

      - name: Show deployed app
        run: modal app info makeupart-v8-api
