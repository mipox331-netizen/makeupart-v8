name: MakeupArt V8 Modal Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: makeupart-v8-modal-production
  cancel-in-progress: false

jobs:
  discover-environments:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      environments: ${{steps.envs.outputs.environments}
    steps:
      - name: Discover repository environments
        id: envs
        shell: bash
        env:
          GH_TOKEN: ${{github.token}
        run: |
          set -euo pipefail
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/environments" --jq '.environments[].name' || true)"
          export ENV_NAMES="$names"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          names = [line.strip() for line in os.environ.get("ENV_NAMES", "").splitlines() if line.strip()]
          if "production" not in {name.lower() for name in names}:
              names.append("production")
          print(f"environments={json.dumps(names, separators=(',', ':'))}")
          PY

  probe-db-secret:
    needs: discover-environments
    if: ${{needs.discover-environments.outputs.environments != '[]'}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{fromJSON(needs.discover-environments.outputs.environments)}
    environment: ${{matrix.environment}
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{secrets.SUPABASE_DB_URL}
    steps:
      - name: Check SUPABASE_DB_URL presence
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{matrix.environment}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          target = os.environ["TARGET_ENVIRONMENT"]
          present = bool(os.environ.get("SUPABASE_DB_URL", "").strip())
          with open("secret-scope.json", "w", encoding="utf-8") as handle:
              json.dump({"environment": target, "present": present}, handle)
          print(f"SUPABASE_DB_URL present in environment '{target}': {present}")
          PY

      - name: Upload secret scope result
        uses: actions/upload-artifact@v4
        with:
          name: db-secret-probe-${{strategy.job-index}
          path: secret-scope.json
          if-no-files-found: error
          retention-days: 1

  select-db-environment:
    needs: probe-db-secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment: ${{steps.select.outputs.environment}
    steps:
      - name: Download secret scope results
        uses: actions/download-artifact@v4
        with:
          pattern: db-secret-probe-*
          path: probes
          merge-multiple: true

      - name: Select environment with database secret
        id: select
        shell: bash
        run: |
          set -euo pipefail
          selected="$(python - <<'PY'
          import glob
          import json

          candidates = []
          for path in glob.glob("probes/*.json"):
              with open(path, encoding="utf-8") as handle:
                  result = json.load(handle)
              if result.get("present"):
                  candidates.append(result["environment"])

          candidates = sorted(set(candidates), key=lambda value: (value.lower() != "production", value.lower()))
          print(candidates[0] if candidates else "")
          PY
          )"

          if [ -z "$selected" ]; then
            echo "SUPABASE_DB_URL is not available to GitHub Actions in any repository environment."
            exit 1
          fi

          echo "Selected GitHub environment: $selected"
          echo "environment=$selected" >> "$GITHUB_OUTPUT"

  deploy:

    runs-on: ubuntu-latest
    needs: select-db-environment
    environment: ${{needs.select-db-environment.outputs.environment}
    permissions:
      contents: read

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.TOKENID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.TOKEN_SECRET || secrets.TOKENI_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Validate Modal credentials
        run: modal token info

      - name: Validate Supabase database
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing."; exit 1; }
          python -m pip install --quiet 'sqlalchemy==2.0.35' 'psycopg2-binary==2.9.9'
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          from sqlalchemy import create_engine, text

          url = os.environ['SUPABASE_DB_URL'].strip()
          parsed = urlparse(url.replace('postgresql+psycopg2://', 'postgresql://', 1))
          if parsed.scheme not in {'postgresql', 'postgres'} or not parsed.hostname:
              raise SystemExit('SUPABASE_DB_URL is not a valid PostgreSQL URL.')
          engine = create_engine(url, pool_pre_ping=True, connect_args={'connect_timeout': 10})
          with engine.connect() as connection:
              connection.execute(text('SELECT 1'))
          print('Supabase database connection: OK')
          print(f'Supabase database target: {parsed.hostname}:{parsed.port or 5432}/{parsed.path.lstrip("/")}')
          PY

      - name: Provision production secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing."; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-}" || { echo "SUPABASE_SECRET_KEY/SUPABASE_SECRET secret is missing."; exit 1; }
          APP_SECRET_KEY="$(python -c 'import hashlib, os; print(hashlib.sha256(os.environ["SUPABASE_SECRET_KEY"].encode()).hexdigest())')"
          modal secret create --force -e main makeupart-v8-production \
            "SECRET_KEY=${APP_SECRET_KEY}" \
            "DATABASE_URL=${SUPABASE_DB_URL}" \
            "ENVIRONMENT=production" \
            "PROJECT_NAME=MakeupArt V8" \
            "API_V1_STR=/api/v1" \
            "ALGORITHM=HS256" \
            "ACCESS_TOKEN_EXPIRE_MINUTES=30" \
            "REFRESH_TOKEN_EXPIRE_DAYS=30" \
            "CORS_ORIGINS=https://riakbjcxcaqjaqagncmu.supabase.co" \
            "MEDIA_ROOT=/app/media" \
            "MAX_UPLOAD_BYTES=10485760" \
            "MAX_IMAGE_PIXELS=40000000" \
            "DB_POOL_SIZE=5" \
            "DB_MAX_OVERFLOW=10" \
            "DB_POOL_RECYCLE_SECONDS=1800" \
            "LOG_LEVEL=INFO" \
            "MEDIA_RETENTION_DAYS=30" \
            "REFRESH_SESSION_RETENTION_DAYS=7" \
            "SUBSCRIPTION_TRIAL_DAYS=30" \
            "PLATFORM_ADMIN_EMAILS=" \
            "SUPABASE_URL=https://riakbjcxcaqjaqagncmu.supabase.co" \
            "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SECRET}"

      - name: Deploy FastAPI
        run: modal deploy modal_app.py

      - name: Run Supabase migrations
        run: modal run modal_app.py::migrate

      - name: Verify production API
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT='https://mipox331-netizen--makeupart-v8-api-fastapi-app.modal.run'
          curl --fail --silent --show-error --max-time 30 "$API_ROOT/health/ready"
          echo
          echo "Production API is ready: $API_ROOT"

      - name: Show deployed app
        run: modal app info makeupart-v8-api
