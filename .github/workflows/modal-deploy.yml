name: MakeupArt V8 Modal Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: makeupart-v8-modal-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || secrets.TOKENID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || secrets.TOKEN_SECRET || secrets.TOKENI_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SECRET || secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Validate Modal credentials
        run: modal token info

      - name: Validate SUPABASE_DB_URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing or empty."; exit 1; }
          python -m pip install --quiet 'psycopg2-binary==2.9.9'
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, quote, unquote

          raw_url = os.environ["SUPABASE_DB_URL"].strip()
          scheme, sep, remainder = raw_url.partition("://")
          if not sep or scheme not in {"postgresql", "postgresql+psycopg2", "postgres"}:
              raise SystemExit("SUPABASE_DB_URL is not a valid PostgreSQL URL.")

          authority, slash, path_and_query = remainder.partition("/")
          user = password = None
          if "@" in authority:
              userinfo, hostport = authority.rsplit("@", 1)
              if ":" in userinfo:
                  user, password = userinfo.rsplit(":", 1)
              else:
                  user = userinfo
          else:
              hostport = authority

          # Supabase pooler URLs may contain brackets around a DNS hostname.
          # Parse host/port ourselves so urllib.parse cannot misclassify that
          # hostname as an IPv6 literal.
          host = hostport
          port = None
          if hostport.startswith("["):
              closing = hostport.find("]")
              if closing < 0:
                  raise SystemExit("SUPABASE_DB_URL has an unmatched '[' in the host.")
              host = hostport[1:closing]
              remainder_hostport = hostport[closing + 1:]
              if remainder_hostport:
                  if not remainder_hostport.startswith(":"):
                      raise SystemExit("SUPABASE_DB_URL has an invalid bracketed host/port.")
                  port = remainder_hostport[1:]
          elif ":" in hostport:
              host, port = hostport.rsplit(":", 1)

          host = host.strip()
          if not host:
              raise SystemExit("SUPABASE_DB_URL is missing a database host.")
          if port is not None and not port.isdigit():
              raise SystemExit("SUPABASE_DB_URL has an invalid database port.")

          query = ""
          database = ""
          if slash:
              database, _, query = path_and_query.partition("?")
              database = unquote(database)

          connect_kwargs = {
              "host": host,
              "connect_timeout": 10,
          }
          if port:
              connect_kwargs["port"] = int(port)
          if user is not None:
              connect_kwargs["user"] = unquote(user)
          if password is not None:
              connect_kwargs["password"] = unquote(password)
          if database:
              connect_kwargs["dbname"] = database

          for key, value in parse_qsl(query, keep_blank_values=True):
              connect_kwargs[key] = value

          import psycopg2
          connection = psycopg2.connect(**connect_kwargs)
          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT 1")
                  cursor.fetchone()
          finally:
              connection.close()

          normalized_scheme = "postgresql"
          encoded_userinfo = ""
          if user is not None:
              encoded_userinfo = quote(unquote(user), safe="")
              if password is not None:
                  encoded_userinfo += ":" + quote(unquote(password), safe="")
              encoded_userinfo += "@"

          normalized_host = f"[{host}]" if ":" in host and not host.startswith("[") else host
          normalized_hostport = normalized_host + (f":{int(port)}" if port else "")
          normalized_url = f"{normalized_scheme}://{encoded_userinfo}{normalized_hostport}"
          if slash:
              normalized_url += "/" + quote(database, safe="") 
              if query:
                  normalized_url += "?" + query

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("SUPABASE_DB_URL=" + normalized_url + "\n")

          print("Supabase database connection: OK")
          print(
              f"Supabase database target: "
              f"{host}:{int(port) if port else 5432}/{database or '<default>'}"
          )
          PY

      - name: Provision production secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing."; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-}" || { echo "SUPABASE_SECRET_KEY/SUPABASE_SECRET secret is missing."; exit 1; }
          APP_SECRET_KEY="$(python -c 'import hashlib, os; print(hashlib.sha256(os.environ["SUPABASE_SECRET_KEY"].encode()).hexdigest())')"
          modal secret create --force -e main makeupart-v8-production             "SECRET_KEY=${APP_SECRET_KEY}"             "DATABASE_URL=${SUPABASE_DB_URL}"             "ENVIRONMENT=production"             "PROJECT_NAME=MakeupArt V8"             "API_V1_STR=/api/v1"             "ALGORITHM=HS256"             "ACCESS_TOKEN_EXPIRE_MINUTES=30"             "REFRESH_TOKEN_EXPIRE_DAYS=30"             "CORS_ORIGINS=https://riakbjcxcaqjaqagncmu.supabase.co"             "MEDIA_ROOT=/app/media"             "INSIGHTFACE_ROOT=/home/app/.insightface"             "MAX_UPLOAD_BYTES=10485760"             "MAX_IMAGE_PIXELS=40000000"             "DB_POOL_SIZE=5"             "DB_MAX_OVERFLOW=10"             "DB_POOL_RECYCLE_SECONDS=1800"             "LOG_LEVEL=INFO"             "MEDIA_RETENTION_DAYS=30"             "REFRESH_SESSION_RETENTION_DAYS=7"             "SUBSCRIPTION_TRIAL_DAYS=30"             "PLATFORM_ADMIN_EMAILS="             "SUPABASE_URL=https://riakbjcxcaqjaqagncmu.supabase.co"             "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"             "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SECRET}"

      - name: Deploy FastAPI
        run: modal deploy modal_app.py

      - name: Run Supabase migrations
        run: modal run modal_app.py::migrate

      - name: Confirm migration head
        run: modal run modal_app.py::verify_migration_head

      - name: Verify AI runtime
        run: modal run modal_app.py::verify_runtime

      - name: Verify deployed app
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT='https://mipox331-netizen--makeupart-v8-api-fastapi-app.modal.run'
          curl --fail --silent --show-error --max-time 30 "$API_ROOT/health/ready"
          echo
          echo "Production API is ready: $API_ROOT"

      - name: Show deployed app
        run: modal app info makeupart-v8-api
